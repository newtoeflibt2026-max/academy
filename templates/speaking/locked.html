<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>درس مقفل</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 20px; color: #fff;
    margin: 0;
  }
  .box {
    background: rgba(255,255,255,0.95); color: #333;
    padding: 40px; border-radius: 20px; max-width: 500px;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .lock-icon { font-size: 4em; margin-bottom: 15px; }
  h1 { color: #2c3e50; margin-bottom: 15px; }
  p { color: #7f8c8d; margin-bottom: 25px; }
  .btn {
    display: inline-block; padding: 12px 30px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; text-decoration: none; border-radius: 25px;
    font-weight: bold; transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="box">
  <div class="lock-icon">🔒</div>
  <h1>هذا الدرس مقفل</h1>
  <p>يجب إكمال الدرس السابق بنتيجة <b>{{ lesson.pass_score }}%</b> أو أعلى لفتح هذا الدرس.</p>
  <a href="/speaking/stage/{{ lesson.stage_id }}?user_id={{ user_id }}" class="btn">
    ← العودة لقائمة الدروس
  </a>
</div>
</body>
</html>
