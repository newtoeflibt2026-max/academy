<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الإدارة | Yamen Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif}
body{background:#f3f4f6;color:#1f2937;min-height:100vh}
.header{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 100%);color:white;padding:20px 24px;box-shadow:0 4px 20px rgba(0,0,0,0.1)}
.header h1{font-size:24px;font-weight:900}
.header p{opacity:0.85;font-size:14px;margin-top:4px}
.container{max-width:1200px;margin:0 auto;padding:24px 16px}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;background:white;padding:8px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.tab-btn{padding:10px 18px;border:none;background:transparent;color:#6b7280;font-weight:700;cursor:pointer;border-radius:10px;font-size:14px;transition:all 0.2s;font-family:inherit}
.tab-btn:hover{background:#f5f3ff;color:#4f46e5}
.tab-btn.active{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;box-shadow:0 4px 12px rgba(79,70,229,0.3)}
.tab-content{display:none;animation:fadeIn 0.3s ease}
.tab-content.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:white;border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.stat-num{font-size:28px;font-weight:900;color:#4f46e5;line-height:1}
.stat-lbl{font-size:13px;color:#6b7280;margin-top:6px;font-weight:600}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;background:white;padding:12px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.toolbar input,.toolbar select{padding:10px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none;flex:1;min-width:140px}
.toolbar input:focus,.toolbar select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
.btn{padding:10px 18px;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:all 0.2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:white;box-shadow:0 4px 12px rgba(79,70,229,0.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,70,229,0.4)}
.btn-danger{background:#ef4444;color:white}
.btn-danger:hover{background:#dc2626}
.btn-secondary{background:#f3f4f6;color:#374151}
.btn-secondary:hover{background:#e5e7eb}
.btn-sm{padding:6px 10px;font-size:12px}
table{width:100%;background:white;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05);border-collapse:collapse}
th{background:#f9fafb;padding:14px 12px;text-align:right;font-size:13px;font-weight:800;color:#374151;border-bottom:2px solid #e5e7eb}
td{padding:12px;border-bottom:1px solid #f3f4f6;font-size:14px;vertical-align:top}
tr:last-child td{border-bottom:none}
tr:hover{background:#fafafa}
.q-cell{max-width:380px;line-height:1.6}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-grammar{background:#dbeafe;color:#1e40af}
.badge-vocabulary{background:#fce7f3;color:#9d174d}
.badge-reading{background:#d1fae5;color:#065f46}
.badge-listening{background:#fef3c7;color:#92400e}
.badge-easy{background:#d1fae5;color:#065f46}
.badge-medium{background:#fef3c7;color:#92400e}
.badge-hard{background:#fee2e2;color:#991b1b}
.badge-active{background:#d1fae5;color:#065f46}
.badge-inactive{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:4px;flex-wrap:wrap}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:white;border-radius:18px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;animation:slideUp 0.3s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal h3{font-size:20px;font-weight:900;margin-bottom:16px;color:#1f2937}
.form-row{margin-bottom:14px}
.form-row label{display:block;font-size:13px;font-weight:700;color:#374151;margin-bottom:6px}
.form-row input,.form-row textarea,.form-row select{width:100%;padding:10px 14px;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;font-family:inherit;outline:none}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,0.1)}
.form-row textarea{min-height:80px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;border-top:1px solid #e5e7eb;padding-top:16px}
.empty{text-align:center;padding:40px;color:#9ca3af}
.toast{position:fixed;bottom:24px;right:24px;background:#10b981;color:white;padding:14px 22px;border-radius:12px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,0.2);z-index:200;animation:slideUp 0.3s ease}
.toast.error{background:#ef4444}
.loading-row{text-align:center;padding:40px;color:#6b7280}
</style>
</head>
<body>

<div class="header">
  <h1>🎓 لوحة إدارة Yamen Academy</h1>
  <p>إدارة الطلاب، الدروس، الباقات، وأسئلة تحديد المستوى</p>
</div>

<div class="container">
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('placement')">📝 أسئلة تحديد المستوى</button>
    <button class="tab-btn" onclick="showTab('students')">👥 الطلاب</button>
    <button class="tab-btn" onclick="showTab('plans')">💎 الباقات</button>
    <button class="tab-btn" onclick="showTab('stats')">📊 الإحصائيات</button>
  </div>

  <!-- ===== Placement Tab ===== -->
  <div id="tab-placement" class="tab-content active">
    <div class="stats-row" id="placement-stats"></div>

    <div class="toolbar">
      <input type="text" id="search-q" placeholder="🔍 ابحث في نص السؤال..." oninput="renderQuestions()">
      <select id="filter-skill" onchange="renderQuestions()">
        <option value="">كل المهارات</option>
        <option value="grammar">Grammar</option>
        <option value="vocabulary">Vocabulary</option>
        <option value="reading">Reading</option>
        <option value="listening">Listening</option>
      </select>
      <select id="filter-diff" onchange="renderQuestions()">
        <option value="">كل المستويات</option>
        <option value="easy">سهل</option>
        <option value="medium">متوسط</option>
        <option value="hard">صعب</option>
      </select>
      <select id="filter-active" onchange="renderQuestions()">
        <option value="">الكل</option>
        <option value="1">نشط</option>
        <option value="0">معطّل</option>
      </select>
      <button class="btn btn-primary" onclick="openQuestionModal(null)">➕ سؤال جديد</button>
    </div>

    <table>
      <thead>
        <tr>
          <th style="width:50px">#</th>
          <th>السؤال</th>
          <th style="width:90px">المهارة</th>
          <th style="width:80px">المستوى</th>
          <th style="width:70px">الإجابة</th>
          <th style="width:80px">الحالة</th>
          <th style="width:160px">إجراءات</th>
        </tr>
      </thead>
      <tbody id="q-tbody">
        <tr><td colspan="7" class="loading-row">جاري التحميل...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Placeholder tabs -->
  <div id="tab-students" class="tab-content"><div class="empty">قسم الطلاب — قيد التطوير</div></div>
  <div id="tab-plans" class="tab-content"><div class="empty">قسم الباقات — قيد التطوير<br><br><a href="/miniapp/plans" target="_blank" class="btn btn-primary">عرض صفحة الباقات</a></div></div>
  <div id="tab-stats" class="tab-content"><div class="empty">الإحصائيات — قيد التطوير</div></div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="q-modal">
  <div class="modal">
    <h3 id="modal-title">➕ سؤال جديد</h3>
    <input type="hidden" id="q-id">
    <div class="form-row">
      <label>نص السؤال</label>
      <textarea id="q-text" placeholder="اكتب نص السؤال هنا..."></textarea>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>الخيار A</label>
        <input id="q-a" type="text">
      </div>
      <div class="form-row">
        <label>الخيار B</label>
        <input id="q-b" type="text">
      </div>
      <div class="form-row">
        <label>الخيار C</label>
        <input id="q-c" type="text">
      </div>
      <div class="form-row">
        <label>الخيار D</label>
        <input id="q-d" type="text">
      </div>
    </div>
    <div class="form-grid">
      <div class="form-row">
        <label>الإجابة الصحيحة</label>
        <select id="q-correct">
          <option value="A">A</option><option value="B">B</option>
          <option value="C">C</option><option value="D">D</option>
        </select>
      </div>
      <div class="form-row">
        <label>المهارة</label>
        <select id="q-skill">
          <option value="grammar">Grammar</option>
          <option value="vocabulary">Vocabulary</option>
          <option value="reading">Reading</option>
          <option value="listening">Listening</option>
        </select>
      </div>
      <div class="form-row">
        <label>المستوى</label>
        <select id="q-diff">
          <option value="easy">سهل (A1-A2)</option>
          <option value="medium" selected>متوسط (B1-B2)</option>
          <option value="hard">صعب (C1)</option>
        </select>
      </div>
      <div class="form-row">
        <label>الحالة</label>
        <select id="q-active">
          <option value="1">نشط</option>
          <option value="0">معطّل</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="saveQuestion()">💾 حفظ</button>
    </div>
  </div>
</div>

<script>
let allQuestions = [];

function showTab(name){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
}

function toast(msg, isError){
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

async function loadQuestions(){
  try {
    const r = await fetch('/api/admin/placement-questions');
    const d = await r.json();
    allQuestions = d.questions || [];
    renderStats();
    renderQuestions();
  } catch(err){
    toast('فشل التحميل: ' + err.message, true);
  }
}

function renderStats(){
  const total = allQuestions.length;
  const active = allQuestions.filter(q => q.is_active === 1).length;
  const skills = {};
  allQuestions.forEach(q => { skills[q.skill] = (skills[q.skill]||0) + 1; });
  const html = `
    <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-lbl">إجمالي الأسئلة</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#10b981">${active}</div><div class="stat-lbl">أسئلة نشطة</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#f59e0b">${total-active}</div><div class="stat-lbl">معطّلة</div></div>
    <div class="stat-card"><div class="stat-num" style="color:#7c3aed">${Object.keys(skills).length}</div><div class="stat-lbl">مهارات مختلفة</div></div>
  `;
  document.getElementById('placement-stats').innerHTML = html;
}

function renderQuestions(){
  const search = (document.getElementById('search-q').value || '').toLowerCase();
  const fSkill = document.getElementById('filter-skill').value;
  const fDiff = document.getElementById('filter-diff').value;
  const fAct = document.getElementById('filter-active').value;

  let list = allQuestions.filter(q => {
    if(search && !(q.question_text||'').toLowerCase().includes(search)) return false;
    if(fSkill && q.skill !== fSkill) return false;
    if(fDiff && q.difficulty !== fDiff) return false;
    if(fAct !== '' && String(q.is_active) !== fAct) return false;
    return true;
  });

  if(!list.length){
    document.getElementById('q-tbody').innerHTML = '<tr><td colspan="7" class="empty">لا توجد أسئلة مطابقة</td></tr>';
    return;
  }

  const rows = list.map(q => `
    <tr>
      <td><strong>#${q.id}</strong></td>
      <td class="q-cell">${escapeHtml(q.question_text||'')}</td>
      <td><span class="badge badge-${q.skill||'grammar'}">${q.skill||'-'}</span></td>
      <td><span class="badge badge-${q.difficulty||'medium'}">${diffLabel(q.difficulty)}</span></td>
      <td><strong>${q.correct_option||'-'}</strong></td>
      <td><span class="badge ${q.is_active==1?'badge-active':'badge-inactive'}">${q.is_active==1?'نشط':'معطّل'}</span></td>
      <td class="actions">
        <button class="btn btn-secondary btn-sm" onclick="openQuestionModal(${q.id})">✏️</button>
        <button class="btn btn-secondary btn-sm" onclick="toggleQuestion(${q.id})">${q.is_active==1?'⏸':'▶️'}</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuestion(${q.id})">🗑</button>
      </td>
    </tr>
  `).join('');
  document.getElementById('q-tbody').innerHTML = rows;
}

function diffLabel(d){ return {easy:'سهل', medium:'متوسط', hard:'صعب'}[d] || d || '-'; }
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openQuestionModal(qid){
  const modal = document.getElementById('q-modal');
  if(qid){
    const q = allQuestions.find(x => x.id === qid);
    if(!q) return;
    document.getElementById('modal-title').textContent = '✏️ تعديل السؤال #' + qid;
    document.getElementById('q-id').value = qid;
    document.getElementById('q-text').value = q.question_text || '';
    document.getElementById('q-a').value = q.option_a || '';
    document.getElementById('q-b').value = q.option_b || '';
    document.getElementById('q-c').value = q.option_c || '';
    document.getElementById('q-d').value = q.option_d || '';
    document.getElementById('q-correct').value = q.correct_option || 'A';
    document.getElementById('q-skill').value = q.skill || 'grammar';
    document.getElementById('q-diff').value = q.difficulty || 'medium';
    document.getElementById('q-active').value = String(q.is_active);
  } else {
    document.getElementById('modal-title').textContent = '➕ سؤال جديد';
    document.getElementById('q-id').value = '';
    ['q-text','q-a','q-b','q-c','q-d'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('q-correct').value = 'A';
    document.getElementById('q-skill').value = 'grammar';
    document.getElementById('q-diff').value = 'medium';
    document.getElementById('q-active').value = '1';
  }
  modal.classList.add('show');
}

function closeModal(){ document.getElementById('q-modal').classList.remove('show'); }

async function saveQuestion(){
  const qid = document.getElementById('q-id').value;
  const body = {
    question_text: document.getElementById('q-text').value.trim(),
    option_a: document.getElementById('q-a').value.trim(),
    option_b: document.getElementById('q-b').value.trim(),
    option_c: document.getElementById('q-c').value.trim(),
    option_d: document.getElementById('q-d').value.trim(),
    correct_option: document.getElementById('q-correct').value,
    skill: document.getElementById('q-skill').value,
    difficulty: document.getElementById('q-diff').value,
    is_active: document.getElementById('q-active').value === '1'
  };
  if(!body.question_text || !body.option_a || !body.option_b){
    toast('السؤال والخيارات A و B مطلوبة', true); return;
  }
  try {
    const url = qid ? `/api/admin/placement-questions/${qid}` : '/api/admin/placement-questions';
    const method = qid ? 'PUT' : 'POST';
    const r = await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    toast(qid ? '✅ تم التعديل' : '✅ تم الإضافة');
    closeModal();
    loadQuestions();
  } catch(err){ toast('خطأ: ' + err.message, true); }
}

async function toggleQuestion(qid){
  try {
    const r = await fetch(`/api/admin/placement-questions/${qid}/toggle`, { method: 'POST' });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    toast('✅ تم تغيير الحالة');
    loadQuestions();
  } catch(err){ toast('خطأ: ' + err.message, true); }
}

async function deleteQuestion(qid){
  if(!confirm('هل أنت متأكد من حذف هذا السؤال؟ لا يمكن التراجع.')) return;
  try {
    const r = await fetch(`/api/admin/placement-questions/${qid}`, { method: 'DELETE' });
    const d = await r.json();
    if(d.error) throw new Error(d.error);
    toast('🗑 تم الحذف');
    loadQuestions();
  } catch(err){ toast('خطأ: ' + err.message, true); }
}

loadQuestions();
</script>
</body>
</html>
