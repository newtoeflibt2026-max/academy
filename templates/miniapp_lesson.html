<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الدرس - أكاديمية يامن</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    window.LESSON_ID = {{ lesson_id|tojson }};
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Tahoma', sans-serif; }
    body { background: #f5f7fb; color: #1a1a2e; min-height: 100vh; padding-bottom: 40px; }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; padding: 20px; border-radius: 0 0 20px 20px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 4px 16px rgba(102,126,234,0.3);
    }
    .btn-back {
      background: rgba(255,255,255,0.2); border: none; color: white;
      padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px;
    }
    .btn-back:hover { background: rgba(255,255,255,0.3); }
    .header-title { font-size: 20px; font-weight: 700; text-align: left; }
    .header-meta { font-size: 13px; opacity: 0.9; margin-top: 6px; }
    .container { padding: 20px; max-width: 800px; margin: 0 auto; }
    .card {
      background: white; border-radius: 16px; padding: 24px;
      margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    }
    .card h2 {
      font-size: 18px; color: #2d3748; margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 2px solid #e2e8f0;
    }
    .content-text { font-size: 16px; line-height: 1.8; color: #4a5568; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .info-box {
      background: #f7f5fc; border-radius: 12px; padding: 16px;
      text-align: center; border: 1px solid #e9d8fd;
    }
    .info-label { font-size: 12px; color: #718096; margin-bottom: 4px; }
    .info-value { font-size: 24px; font-weight: 700; color: #667eea; }
    .pass-hint {
      text-align: center; margin-top: 12px; font-size: 13px; color: #718096;
    }
    .btn-primary {
      display: block; width: 100%; max-width: 400px; margin: 24px auto 0;
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      padding: 16px 24px; border: none; border-radius: 14px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(102,126,234,0.4); transition: transform 0.15s;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error-box {
      background: #fff5f5; border: 1px solid #fc8181; color: #c53030;
      padding: 20px; border-radius: 12px; text-align: center; margin: 20px;
    }
    .badge {
      display: inline-block; background: #48bb78; color: white;
      padding: 4px 12px; border-radius: 12px; font-size: 12px; margin-top: 8px;
    }
    .loading { text-align: center; padding: 40px; color: #718096; }
  </style>
</head>
<body>
  <div class="header">
    <button class="btn-back" onclick="goBack()">رجوع</button>
    <div>
      <div class="header-title" id="lesson-title">جارٍ التحميل...</div>
      <div class="header-meta" id="lesson-meta"></div>
    </div>
  </div>

  <div id="main" class="container">
    <div class="loading">جارٍ تحميل الدرس...</div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();

    function goBack() {
      const sid = getStudentId();
      window.location.href = '/student?student_id=' + (sid || '');
    }

    function getStudentId() {
      // Priority: Telegram > URL > localStorage
      const tgId = tg?.initDataUnsafe?.user?.id;
      const urlParams = new URLSearchParams(window.location.search);
      const urlSid = urlParams.get('student_id');
      const lsId = localStorage.getItem('yamen_student_id');
      // Filter out 'null' string
      const candidates = [tgId, urlSid, lsId].filter(x => x && x !== 'null' && x !== 'undefined');
      const sid = candidates[0];
      if (sid) localStorage.setItem('yamen_student_id', sid);
      return sid;
    }

    function getLessonId() {
      const fromWindow = window.LESSON_ID;
      const urlParams = new URLSearchParams(window.location.search);
      const fromUrl = urlParams.get('lesson_id');
      return fromWindow || fromUrl;
    }

    function showError(msg) {
      document.getElementById('main').innerHTML =
        '<div class="error-box"><h2>خطأ</h2><p>' + msg + '</p>' +
        '<button class="btn-primary" onclick="goBack()" style="margin-top:16px">رجوع</button></div>';
    }

    async function loadLesson() {
      const studentId = getStudentId();
      const lessonId = getLessonId();

      if (!studentId) {
        showError('لم يتم العثور على معرّف الطالب. افتح الدرس من بوت تلغرام.');
        return;
      }
      if (!lessonId) {
        showError('لم يتم العثور على رقم الدرس.');
        return;
      }

      try {
        const r = await fetch('/api/miniapp/lesson/' + lessonId + '?student_id=' + studentId);
        if (!r.ok) {
          showError('تعذّر تحميل الدرس (HTTP ' + r.status + ')');
          return;
        }
        const data = await r.json();
        renderLesson(data, studentId);
      } catch (e) {
        showError('خطأ في الاتصال: ' + e.message);
      }
    }

    function renderLesson(d, studentId) {
      document.getElementById('lesson-title').textContent = d.title || 'الدرس';
      document.getElementById('lesson-meta').textContent =
        (d.xp_reward || 0) + ' XP • ' + (d.total_questions || 0) + ' أسئلة';

      const lessonId = getLessonId();
      const completedBadge = d.completed
        ? '<span class="badge">مكتمل - آخر نتيجة: ' + (d.last_score || 0).toFixed(0) + '%</span>'
        : '';
      const btnLabel = d.completed ? 'إعادة الاختبار' : 'ابدأ الاختبار الآن';

      document.getElementById('main').innerHTML =
        '<div class="card">' +
          '<h2>شرح الدرس ' + completedBadge + '</h2>' +
          '<div class="content-text">' + (d.content || 'لا يوجد محتوى') + '</div>' +
        '</div>' +
        '<div class="card">' +
          '<h2>معلومات الاختبار</h2>' +
          '<div class="info-grid">' +
            '<div class="info-box">' +
              '<div class="info-label">نقاط الخبرة</div>' +
              '<div class="info-value">+' + (d.xp_reward || 10) + '</div>' +
            '</div>' +
            '<div class="info-box">' +
              '<div class="info-label">عدد الأسئلة</div>' +
              '<div class="info-value">' + (d.total_questions || 0) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="pass-hint">درجة النجاح: 70% فأعلى • عدد المحاولات: غير محدود</div>' +
        '</div>' +
        '<button class="btn-primary" onclick="startQuiz()">' + btnLabel + '</button>';
    }

    function startQuiz() {
      const sid = getStudentId();
      const lid = getLessonId();
      window.location.href = '/miniapp/quiz/' + lid + '?student_id=' + sid;
    }

    loadLesson();
  </script>
</body>
</html>
