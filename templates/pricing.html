<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الباقات | Yamen Academy</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: #f8fafc; }
        .card { transition: all 0.3s ease; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .featured { border: 2px solid #f59e0b; box-shadow: 0 10px 30px rgba(245,158,11,0.25); }
        .feature-line { display:flex; align-items:flex-start; gap:6px; padding:4px 0; color:#374151; font-size:14px; }
        .skeleton { background: linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%); background-size:200% 100%; animation: sh 1.2s infinite; border-radius:12px; height:380px; }
        @keyframes sh { 0%{background-position:200% 0}100%{background-position:-200% 0} }
    </style>
</head>
<body class="min-h-screen">
    <header class="bg-gradient-to-r from-indigo-700 to-purple-700 text-white py-6 shadow-lg">
        <div class="container mx-auto px-4 text-center">
            <h1 class="text-3xl font-bold">💎 باقات Yamen Academy</h1>
            <p class="mt-2 text-indigo-100">اختر الباقة المناسبة لرحلتك نحو TOEFL / IELTS</p>
        </div>
    </header>

    <div class="container mx-auto px-4 py-10">
        <div id="plans-grid" class="grid md:grid-cols-2 lg:grid-cols-4 gap-6 max-w-6xl mx-auto">
            <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
        </div>
        <div id="err-box" class="hidden max-w-2xl mx-auto mt-6 bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center"></div>
    </div>

    <div class="container mx-auto px-4 pb-12">
        <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">💳 طرق الدفع المتاحة</h2>
        <div class="grid md:grid-cols-3 gap-4 max-w-3xl mx-auto">
            <div class="bg-white rounded-xl p-4 shadow text-center">
                <div class="text-3xl">💚</div>
                <h3 class="font-bold mt-2">زين كاش</h3>
                <code class="bg-gray-100 px-2 py-1 rounded text-sm mt-1 inline-block">0798919150</code>
            </div>
            <div class="bg-white rounded-xl p-4 shadow text-center">
                <div class="text-3xl">🔵</div>
                <h3 class="font-bold mt-2">كليك</h3>
                <code class="bg-gray-100 px-2 py-1 rounded text-sm mt-1 inline-block">0798919150</code>
            </div>
            <div class="bg-white rounded-xl p-4 shadow text-center">
                <div class="text-3xl">🌍</div>
                <h3 class="font-bold mt-2">Western Union</h3>
                <p class="text-sm text-gray-600 mt-1">واتساب:<br><code class="bg-green-50 px-2 py-1 rounded text-xs">00962798919150</code></p>
            </div>
        </div>
    </div>

    <footer class="text-center text-gray-500 text-sm py-6">
        Yamen Academy © 2026 — جميع الحقوق محفوظة
    </footer>

<script>
(function(){
    try { window.Telegram?.WebApp?.ready(); window.Telegram?.WebApp?.expand(); } catch(e){}

    function resolveStudentId(){
        var qs = new URLSearchParams(window.location.search);
        var sid = qs.get('student_id') || qs.get('user_id');
        if(!sid){ try{ sid = window.Telegram?.WebApp?.initDataUnsafe?.user?.id?.toString(); }catch(e){} }
        if(!sid){ try{ sid = localStorage.getItem('yamen_student_id'); }catch(e){} }
        return sid || '';
    }

    var STUDENT_ID = resolveStudentId();

    function gradientFor(plan){
        if(plan.price === 0) return 'from-emerald-500 to-teal-600';
        if(plan.is_featured) return 'from-amber-500 to-orange-500';
        if(plan.duration_days >= 90) return 'from-purple-500 to-purple-700';
        if((plan.name||'').indexOf('طوارئ') > -1) return 'from-red-500 to-rose-600';
        return 'from-blue-500 to-blue-600';
    }

    function buttonColor(plan){
        if(plan.price === 0) return 'bg-emerald-600 hover:bg-emerald-700';
        if(plan.is_featured) return 'bg-amber-500 hover:bg-amber-600';
        if(plan.duration_days >= 90) return 'bg-purple-600 hover:bg-purple-700';
        if((plan.name||'').indexOf('طوارئ') > -1) return 'bg-red-600 hover:bg-red-700';
        return 'bg-blue-600 hover:bg-blue-700';
    }

    function renderPlans(plans){
        var grid = document.getElementById('plans-grid');
        grid.innerHTML = '';
        plans.forEach(function(p){
            var feats = (p.features || []).join('\n').split('\n').map(function(x){return x.trim();}).filter(Boolean);
            var featuredBadge = p.is_featured ? '<div class="absolute top-3 left-3 bg-amber-400 text-amber-900 px-3 py-1 rounded-full text-xs font-bold shadow">⭐ الأكثر طلباً</div>' : '';
            var cardCls = 'card bg-white rounded-2xl shadow-lg overflow-hidden relative ' + (p.is_featured ? 'featured' : 'border border-gray-100');
            var priceTxt = (p.price === 0) ? '<p class="text-3xl font-bold mt-2">مجاناً</p>' : '<p class="text-3xl font-bold mt-2">' + p.price + ' <small class="text-sm">' + (p.currency||'JOD') + '</small></p>';
            var featsHtml = feats.map(function(f){ return '<div class="feature-line">' + f + '</div>'; }).join('');
            var payHref = '/payment/' + p.id + (STUDENT_ID ? ('?student_id=' + STUDENT_ID) : '');

            grid.insertAdjacentHTML('beforeend',
                '<div class="' + cardCls + '">' +
                    featuredBadge +
                    '<div class="bg-gradient-to-r ' + gradientFor(p) + ' p-6 text-white text-center">' +
                        '<h2 class="text-lg font-bold leading-tight">' + p.name + '</h2>' +
                        priceTxt +
                        '<p class="text-xs opacity-90 mt-1">لمدة ' + p.duration_days + ' يوم</p>' +
                    '</div>' +
                    '<div class="p-5">' +
                        '<p class="text-sm text-gray-600 mb-3 leading-relaxed min-h-[48px]">' + (p.description || '') + '</p>' +
                        '<div class="mb-5">' + featsHtml + '</div>' +
                        '<a href="' + payHref + '" class="block w-full text-center text-white py-3 rounded-xl font-bold transition ' + buttonColor(p) + '">💳 اشترك الآن</a>' +
                    '</div>' +
                '</div>'
            );
        });
    }

    function showErr(msg){
        document.getElementById('plans-grid').innerHTML = '';
        var e = document.getElementById('err-box');
        e.textContent = msg;
        e.classList.remove('hidden');
    }

    fetch('/api/miniapp/plans' + (STUDENT_ID ? ('?student_id=' + STUDENT_ID) : ''))
        .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(data){
            var plans = (data && data.plans) || [];
            if(!plans.length){ showErr('لا توجد باقات متاحة حالياً.'); return; }
            plans.sort(function(a,b){
                if(a.is_featured && !b.is_featured) return -1;
                if(!a.is_featured && b.is_featured) return 1;
                return (a.price||0) - (b.price||0);
            });
            renderPlans(plans);
        })
        .catch(function(err){ showErr('تعذر تحميل الباقات: ' + err.message); });
})();
</script>
</body>
</html>
