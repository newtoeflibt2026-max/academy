<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ lesson.title_ar or lesson.title }} — تمرين</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f8fafc;color:#1e293b;line-height:1.7;min-height:100vh;padding:20px}
.wrap{max-width:850px;margin:0 auto}
.topbar{background:#fff;border-radius:14px;padding:18px 24px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.topbar h1{font-size:18px;color:#1e293b;font-weight:700}
.counter{background:#3b82f6;color:#fff;padding:8px 18px;border-radius:20px;font-weight:700;font-size:15px}
.progress{height:8px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin-bottom:18px}
.progress-bar{height:100%;background:linear-gradient(90deg,#3b82f6,#10b981);width:0%;transition:width .4s}
.card{background:#fff;border-radius:16px;padding:32px;box-shadow:0 4px 16px rgba(0,0,0,.06);margin-bottom:18px}
.qtype{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:4px 12px;border-radius:12px;font-size:12px;font-weight:700;margin-bottom:14px}
.qtype.bs{background:#fef3c7;color:#92400e}
.qtype.rd{background:#dcfce7;color:#166534}
.qtype.cw{background:#fce7f3;color:#9f1239}
.qtext{font-size:19px;font-weight:600;color:#0f172a;margin-bottom:22px;line-height:1.8;direction:ltr;text-align:left;unicode-bidi:isolate}
.passage{background:#f1f5f9;border-right:4px solid #3b82f6;padding:16px 20px;border-radius:8px;margin-bottom:18px;font-size:15px;color:#334155;white-space:pre-wrap}
.options{display:flex;flex-direction:column;gap:10px}
.opt{background:#f8fafc;border:2px solid #e2e8f0;border-radius:10px;padding:14px 18px;cursor:pointer;font-size:16px;font-weight:500;color:#1e293b;text-align:left;transition:.2s;display:flex;align-items:center;gap:12px;direction:ltr;unicode-bidi:isolate;flex-direction:row-reverse;justify-content:flex-end}
.opt:hover{background:#eff6ff;border-color:#3b82f6}
.opt.selected{background:#dbeafe;border-color:#3b82f6}
.opt.correct{background:#dcfce7;border-color:#10b981;color:#065f46}
.opt.wrong{background:#fee2e2;border-color:#ef4444;color:#991b1b}
.opt-letter{background:#e2e8f0;color:#475569;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.opt.correct .opt-letter{background:#10b981;color:#fff}
.opt.wrong .opt-letter{background:#ef4444;color:#fff}
.bs-words{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.word{background:#fef3c7;border:2px solid #f59e0b;color:#92400e;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;user-select:none;transition:.2s}
.word:hover{background:#fde68a}
.word.used{opacity:.3;cursor:not-allowed}
.bs-answer{background:#f1f5f9;border:2px dashed #94a3b8;border-radius:10px;padding:16px;min-height:60px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bs-answer .word{background:#dbeafe;border-color:#3b82f6;color:#1e40af}
.bs-answer:empty::before{content:"اضغط على الكلمات لترتيب الجملة...";color:#94a3b8;font-weight:400}
.cw-input{width:140px;padding:8px 12px;border:2px solid #f59e0b;border-radius:8px;font-size:16px;font-weight:600;text-align:center;background:#fef3c7;color:#92400e;font-family:inherit;direction:ltr}
.cw-input:focus{outline:none;border-color:#3b82f6;background:#dbeafe}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;font-family:inherit}
.btn-primary{background:#3b82f6;color:#fff}
.btn-primary:hover{background:#2563eb}
.btn-primary:disabled{background:#cbd5e1;cursor:not-allowed}
.btn-success{background:#10b981;color:#fff}
.btn-success:hover{background:#059669}
.btn-ghost{background:#f1f5f9;color:#475569}
.btn-ghost:hover{background:#e2e8f0}
.explain{margin-top:18px;padding:16px 20px;border-radius:10px;display:none}
.explain.show{display:block}
.explain.correct{background:#dcfce7;border-right:4px solid #10b981;color:#065f46}
.explain.wrong{background:#fee2e2;border-right:4px solid #ef4444;color:#991b1b}
.explain h4{margin-bottom:8px;font-size:15px}
.explain p{font-size:14px;line-height:1.7}
.translation{margin-top:12px;padding:10px;background:rgba(255,255,255,.6);border-radius:6px;font-size:13px;color:#475569}
.final{text-align:center;padding:40px 20px}
.final h2{font-size:32px;color:#10b981;margin-bottom:16px}
.final .score{font-size:64px;font-weight:800;color:#3b82f6;margin:20px 0}
.final p{font-size:16px;color:#475569;margin-bottom:24px}

.why-box{margin-top:12px;padding:14px 16px;border-radius:10px;border-right:4px solid}
.why-correct{background:#dcfce7;border-color:#16a34a}
.why-wrong{background:#fee2e2;border-color:#dc2626}
.why-head{font-weight:700;font-size:15px;margin-bottom:6px;color:#0f172a}
.why-body{font-size:14px;line-height:1.7;color:#1e293b}
.why-others{margin-top:14px;padding:12px 16px;background:#f8fafc;border-radius:10px;border:1px solid #e2e8f0}
.why-others-title{font-weight:700;font-size:14px;margin-bottom:10px;color:#475569}
.why-other{padding:8px 0;border-bottom:1px dashed #e2e8f0}
.why-other:last-child{border-bottom:none}
.why-other-head{font-weight:600;font-size:14px;color:#334155;margin-bottom:4px}
.why-other-body{font-size:13px;color:#64748b;line-height:1.6;padding-right:8px}
.why-tip{margin-top:12px;padding:10px 14px;background:#fef9c3;border-right:4px solid #eab308;border-radius:8px;font-size:14px;color:#713f12}
.translation{margin-top:10px;padding:8px 12px;background:#eff6ff;border-right:4px solid #3b82f6;border-radius:8px;font-size:13px;color:#1e3a8a}
</style>
</head>
<body>
<div class="wrap">

<div class="topbar">
  <h1>📝 {{ lesson.title_ar or lesson.title }}</h1>
  <div class="counter"><span id="cur">1</span> / <span id="tot">{{ total }}</span></div>
</div>

<div class="progress"><div class="progress-bar" id="pbar"></div></div>

<div id="quizArea"></div>

<div id="finalArea" style="display:none">
  <div class="card final">
    <h2>🎉 أحسنت!</h2>
    <div class="score" id="finalScore">0%</div>
    <p>أجبت <strong id="rightCount">0</strong> من <strong id="totCount">0</strong> أسئلة بشكل صحيح</p>
    <div class="actions" style="justify-content:center">
      <a href="/foundation/lesson/{{ lesson.id }}?user_id={{ user_id }}" class="btn btn-ghost">← العودة للدرس</a>
      <button class="btn btn-primary" onclick="location.reload()">🔄 إعادة المحاولة</button>
    </div>
  </div>
</div>

</div>

<script>
const LESSON_ID = {{ lesson.id|default(0) }};
  const USER_ID = "{{ user_id|default('') }}";
  const QUESTIONS = {{ questions_json|safe }};
let idx = 0, right = 0, answered = false, currentAns = null, bsAnswer = [];

const $ = id => document.getElementById(id);

function render(){
  const q = QUESTIONS[idx];
  $('cur').textContent = idx + 1;
  $('pbar').style.width = ((idx)/QUESTIONS.length*100) + '%';
  answered = false; currentAns = null; bsAnswer = [];

  let html = '<div class="card">';
  const type = q.q_type || 'mcq';
  const typeLabel = {mcq:'اختيار من متعدد', build_sentence:'رتّب الجملة', reading_mcq:'قراءة وفهم', complete_words:'أكمل الكلمة'}[type] || 'سؤال';
  const typeCls = {build_sentence:'bs', reading_mcq:'rd', complete_words:'cw'}[type] || '';
  html += `<span class="qtype ${typeCls}">${typeLabel}</span>`;

  if(type === 'reading_mcq' && q.passage){
    html += `<div class="passage">${escapeHtml(q.passage)}</div>`;
  }
  html += `<div class="qtext">${q.question_text || ''}</div>`;

  if(type === 'mcq' || type === 'reading_mcq'){
    html += renderMCQ(q);
  } else if(type === 'build_sentence'){
    html += renderBS(q);
  } else if(type === 'complete_words'){
    html += renderCW(q);
  } else {
    html += renderMCQ(q);
  }

  html += `<div class="explain" id="explain"></div>`;
  html += `<div class="actions">
    <button class="btn btn-primary" id="checkBtn" onclick="check()" disabled>تحقق ✓</button>
    <button class="btn btn-success" id="nextBtn" onclick="next()" style="display:none">التالي ←</button>
  </div></div>`;

  $('quizArea').innerHTML = html;
}

function renderMCQ(q){
  let opts = q.options || [];
  if(typeof opts === 'string'){ try{ opts = JSON.parse(opts); }catch(e){ opts = []; } }
  if(!Array.isArray(opts) || opts.length === 0){
    opts = [q.option_a, q.option_b, q.option_c, q.option_d].filter(Boolean);
  }
  const letters = ['A','B','C','D','E'];
  let h = '<div class="options">';
  opts.forEach((o,i)=>{
    h += `<div class="opt" data-letter="${letters[i]}" onclick="selectOpt(this)">
      <span class="opt-letter">${letters[i]}</span><span>${escapeHtml(o)}</span></div>`;
  });
  return h + '</div>';
}

function renderBS(q){
  let words = q.scrambled_words || [];
  if(typeof words === 'string'){ try{ words = JSON.parse(words); }catch(e){ words = []; } }
  let h = '<div class="bs-answer" id="bsAns"></div><div class="bs-words" id="bsWords">';
  words.forEach((w,i)=>{
    h += `<span class="word" data-i="${i}" onclick="pickWord(this)">${escapeHtml(w)}</span>`;
  });
  h += '</div>';
  h += '<button class="btn btn-ghost" type="button" onclick="resetBS()" style="margin-top:8px">↺ إعادة</button>';
  return h;
}

function renderCW(q){
  const tpl = q.question_text || '';
  return `<div style="margin:14px 0"><input type="text" class="cw-input" id="cwInput" placeholder="..." oninput="cwChange()" autocomplete="off"></div>`;
}

function selectOpt(el){
  if(answered) return;
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('selected'));
  el.classList.add('selected');
  currentAns = el.dataset.letter;
  $('checkBtn').disabled = false;
}

function pickWord(el){
  if(answered || el.classList.contains('used')) return;
  el.classList.add('used');
  const ans = $('bsAns');
  const clone = el.cloneNode(true);
  clone.classList.remove('used');
  clone.onclick = function(){
    if(answered) return;
    el.classList.remove('used');
    clone.remove();
    bsAnswer = bsAnswer.filter(x => x !== el.dataset.i);
    updateBSBtn();
  };
  ans.appendChild(clone);
  bsAnswer.push(el.dataset.i);
  updateBSBtn();
}

function updateBSBtn(){
  $('checkBtn').disabled = bsAnswer.length === 0;
}

function resetBS(){
  if(answered) return;
  $('bsAns').innerHTML = '';
  document.querySelectorAll('#bsWords .word').forEach(w=>w.classList.remove('used'));
  bsAnswer = [];
  $('checkBtn').disabled = true;
}

function cwChange(){
  const v = $('cwInput').value.trim();
  currentAns = v;
  $('checkBtn').disabled = v.length === 0;
}

function check(){
  if(answered) return;
  answered = true;
  const q = QUESTIONS[idx];
  const type = q.q_type || 'mcq';
  let isRight = false;
  let userAns = '';

  if(type === 'mcq' || type === 'reading_mcq'){
    userAns = currentAns;
    const correct = (q.correct_answer || '').toString().trim().toUpperCase();
    isRight = userAns === correct;
    document.querySelectorAll('.opt').forEach(o=>{
      if(o.dataset.letter === correct) o.classList.add('correct');
      else if(o.dataset.letter === userAns && !isRight) o.classList.add('wrong');
    });
  } else if(type === 'build_sentence'){
    let words = q.scrambled_words || [];
    if(typeof words === 'string'){ try{ words = JSON.parse(words); }catch(e){} }
    userAns = bsAnswer.map(i => words[i]).join(' ');
    const correct = (q.correct_answer || '').toString().trim();
    isRight = normalize(userAns) === normalize(correct);
  } else if(type === 'complete_words'){
    userAns = ($('cwInput').value || '').trim();
    const correct = (q.correct_answer || '').toString().trim();
    isRight = userAns.toLowerCase() === correct.toLowerCase();
    $('cwInput').style.borderColor = isRight ? '#10b981' : '#ef4444';
    $('cwInput').style.background = isRight ? '#dcfce7' : '#fee2e2';
  }

  if(isRight) right++;

  const ex = $('explain');
  ex.className = 'explain show ' + (isRight ? 'correct' : 'wrong');
  const correctLetter = (q.correct_answer || '').toString().toUpperCase();
  const userLetter = (currentAns || '').toString().toUpperCase();
  const letters = ['A','B','C','D','E'];
  const opts = q.options || [];
  function isEng(s){ return s && /[A-Za-z]/.test(s) && !/[\u0600-\u06FF]/.test(s); }
  function dirAttr(s){ return isEng(s) ? 'dir="ltr" style="text-align:left;unicode-bidi:isolate"' : 'dir="rtl"'; }

  let exHtml = `<h4>${isRight ? '✅ إجابة صحيحة!' : '❌ إجابة خاطئة'}</h4>`;

  // 1) الإجابة الصحيحة
  const correctIdx = letters.indexOf(correctLetter);
  const correctText = correctIdx >= 0 && opts[correctIdx] ? opts[correctIdx] : '';
  const whyCorrect = q['why_' + correctLetter.toLowerCase()] || '';
  exHtml += `<div class="why-box why-correct">
    <div class="why-head">✅ الإجابة الصحيحة: <b>${correctLetter}</b> — <span ${dirAttr(correctText)}>${escapeHtml(correctText)}</span></div>
    ${whyCorrect ? `<div class="why-body" ${dirAttr(whyCorrect)}><b>لماذا صحيحة؟</b> ${escapeHtml(whyCorrect)}</div>` : ''}
  </div>`;

  // 2) إجابة الطالب الخاطئة
  if(!isRight && userLetter && userLetter !== correctLetter){
    const userIdx = letters.indexOf(userLetter);
    const userText = userIdx >= 0 && opts[userIdx] ? opts[userIdx] : '';
    const whyUser = q['why_' + userLetter.toLowerCase()] || '';
    exHtml += `<div class="why-box why-wrong">
      <div class="why-head">❌ إجابتك: <b>${userLetter}</b> — <span ${dirAttr(userText)}>${escapeHtml(userText)}</span></div>
      ${whyUser ? `<div class="why-body" ${dirAttr(whyUser)}><b>لماذا خطأ؟</b> ${escapeHtml(whyUser)}</div>` : ''}
    </div>`;
  }

  // 3) بقية الخيارات
  const others = [];
  for(let i=0; i<opts.length; i++){
    const L = letters[i];
    if(L === correctLetter) continue;
    if(!isRight && L === userLetter) continue;
    const w = q['why_' + L.toLowerCase()] || '';
    if(opts[i]) others.push({L:L, text:opts[i], why:w});
  }
  if(others.length){
    exHtml += `<div class="why-others"><div class="why-others-title">📋 شرح بقية الخيارات:</div>`;
    others.forEach(o => {
      exHtml += `<div class="why-other">
        <div class="why-other-head"><b>${o.L}</b> — <span ${dirAttr(o.text)}>${escapeHtml(o.text)}</span></div>
        ${o.why ? `<div class="why-other-body" ${dirAttr(o.why)}>❌ ${escapeHtml(o.why)}</div>` : ''}
      </div>`;
    });
    exHtml += `</div>`;
  }

  // 4) النصيحة + الترجمة
  if(q.tip){ exHtml += `<div class="why-tip" ${dirAttr(q.tip)}>💡 ${escapeHtml(q.tip)}</div>`; }
  if(q.translation_ar){ exHtml += `<div class="translation" dir="rtl">🌐 ${escapeHtml(q.translation_ar)}</div>`; }

  ex.innerHTML = exHtml;

  $('checkBtn').style.display = 'none';
  $('nextBtn').style.display = 'inline-block';
  if(idx === QUESTIONS.length - 1) $('nextBtn').textContent = 'إنهاء 🏁';
}

function next(){
  idx++;
  if(idx >= QUESTIONS.length){ showFinal(); return; }
  render();
}

function showFinal(){
  $('quizArea').style.display = 'none';
  $('finalArea').style.display = 'block';
  const pct = Math.round(right / QUESTIONS.length * 100);
  $('finalScore').textContent = pct + '%';
  $('rightCount').textContent = right;
  $('totCount').textContent = QUESTIONS.length;
  showGateMessage(pct, right, QUESTIONS.length);
  $('pbar').style.width = '100%';
  fetch('/api/quiz/finish', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lesson_id:{{ lesson.id }}, score:pct, user_id:{{ user_id }}})
  }).catch(()=>{});
}

function normalize(s){ return (s||'').toLowerCase().replace(/[.,!?؛،]/g,'').replace(/\s+/g,' ').trim(); }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

render();

// ============ بوابة التأسيس - رسالة النجاح/الرسوب ============
function showGateMessage(pct, right, total) {
  if (LESSON_ID !== 70) return;
  const target = document.getElementById('finalScore').closest('div').parentElement;
  if (!target) return;
  
  if (pct < 75) {
    const failMsg = `
      <div style="background:linear-gradient(135deg,#fef3c7,#fde68a); padding:25px; border-radius:15px; margin-top:25px; text-align:center; border:2px solid #f59e0b;">
        <div style="font-size:50px;">💪</div>
        <h2 style="color:#78350f; margin:10px 0;">قريب جداً! لا تستسلم</h2>
        <p style="font-size:16px; color:#451a03; line-height:1.8;">
          حصلت على <b>${pct}%</b> (${right}/${total}). تحتاج <b>75%</b> لاجتياز البوابة.
        </p>
        <p style="font-size:15px; color:#92400e;">
          🎯 راجع الدروس التي أخطأت فيها<br>💡 كل محاولة تجعلك أقوى
        </p>
        <a href="/foundation/quiz/70?user_id=${USER_ID}" style="display:inline-block; margin-top:15px; background:#f59e0b; color:white; padding:12px 30px; border-radius:10px; text-decoration:none; font-weight:bold;">🔄 حاول مرة أخرى</a>
      </div>
    `;
    target.insertAdjacentHTML('beforeend', failMsg);
    return;
  }
  
  // رسالة النجاح + إرشاد القراءة (TOEFL 2026 Reading - ETS Official)
  const successMsg = `
    <div style="background:linear-gradient(135deg,#11998e,#38ef7d); color:white; padding:30px; border-radius:18px; margin-top:25px; text-align:center; box-shadow:0 15px 40px rgba(17,153,142,0.3);">
      <div style="font-size:70px; margin-bottom:5px;">🏆</div>
      <h1 style="margin:5px 0; font-size:28px;">🎉 مبروك! لقد عبرت البوابة!</h1>
      <p style="font-size:17px; opacity:0.95; line-height:1.8; margin:15px 0;">
        أكملت مرحلة التأسيس بنجاح بنسبة <b>${pct}%</b>.<br>
        أنت الآن جاهز للمحطة التالية رسمياً! 🚀
      </p>
    </div>
    
    <div style="background:linear-gradient(135deg,#dbeafe,#bfdbfe); padding:25px; border-radius:15px; margin-top:20px; border-right:6px solid #3b82f6;">
      <h2 style="color:#1e3a8a; margin-top:0;">📖 المحطة التالية: قسم القراءة (TOEFL iBT 2026)</h2>
      <p style="font-size:15px; color:#1e3a8a; background:white; padding:12px; border-radius:8px; margin:10px 0;">
        🌐 <b>وفق المصدر الرسمي ETS.org:</b> منذ 21 يناير 2026، تم تجديد قسم القراءة بالكامل ليكون <b>أقصر وأذكى وأكثر تفاعلية</b>.
      </p>
      
      <h3 style="color:#1e40af; margin:18px 0 10px;">📊 بنية الاختبار الجديدة</h3>
      <table style="width:100%; border-collapse:collapse; background:white; border-radius:8px; overflow:hidden;">
        <tr style="background:#3b82f6; color:white;">
          <th style="padding:10px; text-align:right;">العنصر</th>
          <th style="padding:10px;">التفاصيل</th>
        </tr>
        <tr><td style="padding:10px; border-bottom:1px solid #e5e7eb;">⏱️ المدة</td><td style="padding:10px; border-bottom:1px solid #e5e7eb;">~30 دقيقة</td></tr>
        <tr style="background:#f8fafc;"><td style="padding:10px; border-bottom:1px solid #e5e7eb;">📝 عدد الأسئلة</td><td style="padding:10px; border-bottom:1px solid #e5e7eb;">حتى 50 سؤال</td></tr>
        <tr><td style="padding:10px; border-bottom:1px solid #e5e7eb;">📊 الدرجة</td><td style="padding:10px; border-bottom:1px solid #e5e7eb;">من 1 إلى 6</td></tr>
        <tr style="background:#f8fafc;"><td style="padding:10px;">📚 طبيعة النصوص</td><td style="padding:10px;">قصيرة ومركّزة (لا حاجة لمعرفة مسبقة)</td></tr>
      </table>
      
      <h3 style="color:#1e40af; margin:20px 0 10px;">🎯 المهام الثلاث (Task Types — ETS Official)</h3>
      
      <div style="background:white; padding:15px; border-radius:10px; margin:10px 0; border-right:4px solid #10b981;">
