<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الاختبار - أكاديمية يامن</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    window.LESSON_ID = {{ lesson_id|tojson }};
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', 'Tahoma', sans-serif; }
    body { background: #f5f7fb; color: #1a1a2e; min-height: 100vh; padding-bottom: 40px; }
    .header {
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      padding: 16px 20px; box-shadow: 0 4px 16px rgba(102,126,234,0.3);
    }
    .header-row { display: flex; justify-content: space-between; align-items: center; }
    .btn-back { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 18px; cursor: pointer; font-size: 13px; }
    .progress-text { font-size: 14px; font-weight: 600; }
    .progress-bar { background: rgba(255,255,255,0.25); height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden; }
    .progress-fill { background: white; height: 100%; transition: width 0.3s; border-radius: 4px; }
    .container { padding: 20px; max-width: 700px; margin: 0 auto; }
    .question-card {
      background: white; border-radius: 18px; padding: 28px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .q-number { color: #667eea; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    .q-text { font-size: 18px; line-height: 1.7; color: #1a202c; margin-bottom: 24px; font-weight: 600; }
    .options { display: flex; flex-direction: column; gap: 10px; }
    .option {
      background: #f7fafc; border: 2px solid #e2e8f0; padding: 14px 18px;
      border-radius: 12px; cursor: pointer; font-size: 16px; transition: all 0.15s;
      text-align: right; display: flex; align-items: center; gap: 12px;
    }
    .option:hover { border-color: #cbd5e0; background: #edf2f7; }
    .option.selected { border-color: #667eea; background: #ebf4ff; }
    .option.correct { border-color: #48bb78; background: #f0fff4; color: #22543d; }
    .option.wrong { border-color: #fc8181; background: #fff5f5; color: #742a2a; }
    .option-letter {
      display: inline-flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%; background: #e2e8f0;
      font-weight: 700; flex-shrink: 0;
    }
    .option.selected .option-letter { background: #667eea; color: white; }
    .option.correct .option-letter { background: #48bb78; color: white; }
    .option.wrong .option-letter { background: #fc8181; color: white; }
    .btn-primary {
      display: block; width: 100%; max-width: 400px; margin: 24px auto 0;
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      padding: 16px; border: none; border-radius: 14px;
      font-size: 17px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 16px rgba(102,126,234,0.4); transition: transform 0.15s;
    }
    .btn-primary:hover:not(:disabled) { transform: translateY(-2px); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }
    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: none; align-items: center;
      justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-overlay.show { display: flex; }
    .modal {
      background: white; border-radius: 20px; padding: 28px; max-width: 500px;
      width: 100%; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-icon { font-size: 48px; text-align: center; margin-bottom: 12px; }
    .modal-title { text-align: center; font-size: 22px; font-weight: 700; margin-bottom: 16px; }
    .modal-title.wrong { color: #c53030; }
    .modal-title.correct { color: #2f855a; }
    .modal-section { margin-bottom: 16px; padding: 14px; background: #f7fafc; border-radius: 12px; }
    .modal-label { font-size: 12px; color: #718096; font-weight: 600; margin-bottom: 4px; }
    .modal-value { font-size: 15px; color: #2d3748; line-height: 1.7; }
    .concept-box { background: #fef5e7; border-right: 4px solid #ed8936; padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .concept-title { font-weight: 700; color: #c05621; margin-bottom: 6px; }
    /* Result screen */
    .result-card {
      background: white; border-radius: 20px; padding: 32px; text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-top: 20px;
    }
    .result-icon { font-size: 64px; margin-bottom: 16px; }
    .result-score { font-size: 48px; font-weight: 800; margin: 8px 0; }
    .result-score.pass { color: #48bb78; }
    .result-score.fail { color: #f56565; }
    .result-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .result-stat { background: #f7fafc; padding: 14px; border-radius: 12px; }
    .stat-label { font-size: 12px; color: #718096; }
    .stat-value { font-size: 20px; font-weight: 700; color: #2d3748; margin-top: 4px; }
    .cooldown-box { background: #fff5f5; border: 1px solid #feb2b2; padding: 14px; border-radius: 12px; margin-top: 16px; color: #742a2a; }
    .loading { text-align: center; padding: 60px 20px; color: #718096; font-size: 16px; }
    .error-box { background: #fff5f5; border: 1px solid #fc8181; color: #c53030; padding: 20px; border-radius: 12px; text-align: center; margin: 20px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-row">
      <button class="btn-back" onclick="exitQuiz()">خروج</button>
      <div class="progress-text" id="progress-text">جارٍ التحميل...</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>

  <div id="main" class="container">
    <div class="loading">جارٍ تحضير الاختبار...</div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-icon" id="modal-icon"></div>
      <div class="modal-title" id="modal-title"></div>
      <div id="modal-body"></div>
      <button class="btn-primary" onclick="closeModal()">فهمت، التالي</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();

    let STATE = {
      questions: [],
      currentIdx: 0,
      answers: [],
      attemptId: null,
      selectedOption: null,
      answered: false,
      studentId: null,
      lessonId: null
    };

    function getStudentId() {
      const tgId = tg?.initDataUnsafe?.user?.id;
      const urlParams = new URLSearchParams(window.location.search);
      const urlSid = urlParams.get('student_id');
      const lsId = localStorage.getItem('yamen_student_id');
      const candidates = [tgId, urlSid, lsId].filter(x => x && x !== 'null' && x !== 'undefined');
      const sid = candidates[0];
      if (sid) localStorage.setItem('yamen_student_id', sid);
      return sid;
    }

    function getLessonId() {
      const urlParams = new URLSearchParams(window.location.search);
      return window.LESSON_ID || urlParams.get('lesson_id');
    }

    function exitQuiz() {
      window.location.href = '/miniapp/lesson/' + STATE.lessonId + '?student_id=' + STATE.studentId;
    }

    function showError(msg) {
      document.getElementById('main').innerHTML =
        '<div class="error-box"><h2>خطأ</h2><p>' + msg + '</p>' +
        '<button class="btn-primary" onclick="exitQuiz()" style="margin-top:16px">رجوع للدرس</button></div>';
    }

    async function startQuiz() {
      STATE.studentId = getStudentId();
      STATE.lessonId = getLessonId();

      if (!STATE.studentId) { showError('لم يتم العثور على معرّف الطالب'); return; }
      if (!STATE.lessonId) { showError('لم يتم العثور على رقم الدرس'); return; }

      try {
        const r = await fetch('/api/miniapp/quiz/start', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ student_id: STATE.studentId, lesson_id: STATE.lessonId })
        });
        const data = await r.json();

        if (data.cooldown && data.cooldown.locked) {
          showCooldown(data.cooldown);
          return;
        }

        if (!data.questions || data.questions.length === 0) {
          showError('لا توجد أسئلة لهذا الدرس');
          return;
        }

        STATE.questions = data.questions;
        STATE.attemptId = data.attempt_id;
        renderQuestion();
      } catch (e) {
        showError('خطأ في الاتصال: ' + e.message);
      }
    }

    function showCooldown(cd) {
      document.getElementById('main').innerHTML =
        '<div class="result-card">' +
          '<div class="result-icon">⏰</div>' +
          '<div class="modal-title wrong">الاختبار مغلق مؤقتاً</div>' +
          '<div class="cooldown-box">' +
            '<p>يمكنك إعادة المحاولة بعد:</p>' +
            '<p style="font-size:24px;font-weight:700;margin-top:8px">' + (cd.remaining_text || cd.remaining + ' ثانية') + '</p>' +
          '</div>' +
          '<button class="btn-primary" onclick="exitQuiz()" style="margin-top:20px">رجوع للدرس</button>' +
        '</div>';
    }

    function renderQuestion() {
      const q = STATE.questions[STATE.currentIdx];
      const total = STATE.questions.length;
      const pct = ((STATE.currentIdx) / total) * 100;
      document.getElementById('progress-text').textContent = 'سؤال ' + (STATE.currentIdx + 1) + ' من ' + total;
      document.getElementById('progress-fill').style.width = pct + '%';

      STATE.selectedOption = null;
      STATE.answered = false;

      const opts = ['A', 'B', 'C', 'D'];
      let optHtml = '';
      opts.forEach(letter => {
        const text = q['option_' + letter.toLowerCase()] || '';
        if (text) {
          optHtml += '<div class="option" data-letter="' + letter + '" onclick="selectOption(\'' + letter + '\')">' +
            '<div class="option-letter">' + letter + '</div>' +
            '<div class="option-text">' + text + '</div>' +
          '</div>';
        }
      });

      document.getElementById('main').innerHTML =
        '<div class="question-card">' +
          '<div class="q-number">السؤال ' + (STATE.currentIdx + 1) + '</div>' +
          '<div class="q-text">' + q.question + '</div>' +
          '<div class="options">' + optHtml + '</div>' +
        '</div>' +
        '<button class="btn-primary" id="submit-btn" onclick="submitAnswer()" disabled>تأكيد الإجابة</button>';
    }

    function selectOption(letter) {
      if (STATE.answered) return;
      STATE.selectedOption = letter;
      document.querySelectorAll('.option').forEach(el => {
        el.classList.toggle('selected', el.dataset.letter === letter);
      });
      document.getElementById('submit-btn').disabled = false;
    }

    async function submitAnswer() {
      if (!STATE.selectedOption || STATE.answered) return;
      STATE.answered = true;
      document.getElementById('submit-btn').disabled = true;

      const q = STATE.questions[STATE.currentIdx];

      try {
        const r = await fetch('/api/miniapp/quiz/answer', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            student_id: STATE.studentId,
            question_id: q.id,
            answer: STATE.selectedOption
          })
        });
        const data = await r.json();

        STATE.answers.push({
          q_id: q.id,
          user: STATE.selectedOption,
          correct: data.correct_answer,
          is_correct: data.is_correct
        });

        // Mark visual
        document.querySelectorAll('.option').forEach(el => {
          if (el.dataset.letter === data.correct_answer) el.classList.add('correct');
          if (el.dataset.letter === STATE.selectedOption && !data.is_correct) el.classList.add('wrong');
        });

        // Show modal
        showResultModal(data, q);
      } catch (e) {
        showError('خطأ: ' + e.message);
      }
    }

    function showResultModal(data, q) {
      const isCorrect = data.is_correct;
      document.getElementById('modal-icon').textContent = isCorrect ? '✅' : '❌';
      document.getElementById('modal-title').textContent = isCorrect ? 'إجابة صحيحة!' : 'إجابة خاطئة';
      document.getElementById('modal-title').className = 'modal-title ' + (isCorrect ? 'correct' : 'wrong');

      let body = '';
      if (!isCorrect) {
        body += '<div class="modal-section"><div class="modal-label">الإجابة الصحيحة</div><div class="modal-value"><b>' + data.correct_answer + '</b></div></div>';
        if (data.concept) {
          body += '<div class="concept-box"><div class="concept-title">💡 المفهوم</div><div>' + data.concept + '</div></div>';
        }
        if (data.explanation) {
          body += '<div class="modal-section"><div class="modal-label">الشرح</div><div class="modal-value">' + data.explanation + '</div></div>';
        }
      } else {
        body += '<div class="modal-section"><div class="modal-value">أحسنت! استمر بنفس الأداء.</div></div>';
        if (data.tip) {
          body += '<div class="concept-box"><div class="concept-title">💡 نصيحة</div><div>' + data.tip + '</div></div>';
        }
      }
      document.getElementById('modal-body').innerHTML = body;
      document.getElementById('modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
      STATE.currentIdx++;
      if (STATE.currentIdx >= STATE.questions.length) {
        finishQuiz();
      } else {
        renderQuestion();
      }
    }

    async function finishQuiz() {
      document.getElementById('main').innerHTML = '<div class="loading">جارٍ احتساب النتيجة...</div>';
      try {
        const r = await fetch('/api/miniapp/quiz/finish', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            student_id: STATE.studentId,
            lesson_id: STATE.lessonId,
            attempt_id: STATE.attemptId,
            answers: STATE.answers
          })
        });
        const data = await r.json();
        showResult(data);
      } catch (e) {
        showError('خطأ في حفظ النتيجة: ' + e.message);
      }
    }

    function showResult(d) {
      document.getElementById('progress-fill').style.width = '100%';
      document.getElementById('progress-text').textContent = 'انتهى الاختبار';
      const passed = d.passed;
      let cooldownHtml = '';
      if (!passed && d.cooldown && d.cooldown.remaining_text) {
        cooldownHtml = '<div class="cooldown-box">⏰ يمكنك إعادة المحاولة بعد: <b>' + d.cooldown.remaining_text + '</b></div>';
      }
      document.getElementById('main').innerHTML =
        '<div class="result-card">' +
          '<div class="result-icon">' + (passed ? '🎉' : '💪') + '</div>' +
          '<div class="modal-title ' + (passed ? 'correct' : 'wrong') + '">' +
            (passed ? 'مبروك! نجحت' : 'لم تنجح هذه المرة') +
          '</div>' +
          '<div class="result-score ' + (passed ? 'pass' : 'fail') + '">' + d.score.toFixed(0) + '%</div>' +
          '<div class="result-stats">' +
            '<div class="result-stat"><div class="stat-label">صحيحة</div><div class="stat-value">' + d.correct + ' / ' + d.total + '</div></div>' +
            '<div class="result-stat"><div class="stat-label">نقاط مكتسبة</div><div class="stat-value">+' + (d.xp_earned || 0) + ' XP</div></div>' +
          '</div>' +
          cooldownHtml +
          '<button class="btn-primary" onclick="exitQuiz()" style="margin-top:20px">العودة للدرس</button>' +
        '</div>';
    }

    startQuiz();
  </script>
</body>
</html>
