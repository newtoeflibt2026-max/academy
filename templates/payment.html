<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع | Yamen Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background: #f8fafc; }
        .step-active { background: #4f46e5; color: white; }
        .step-done { background: #22c55e; color: white; }
        .step-waiting { background: #e2e8f0; color: #64748b; }
    </style>
</head>
<body class="min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">💳 إتمام الدفع</h1>
            <p class="text-gray-600 mt-2" id="planName">جارٍ التحميل...</p>
        </div>

        <!-- Steps -->
        <div class="flex justify-center gap-2 mb-8" id="steps">
            <div class="step-active px-4 py-2 rounded-full text-sm font-bold" id="step1">1. اختر طريقة الدفع</div>
            <div class="step-waiting px-4 py-2 rounded-full text-sm font-bold" id="step2">2. أرسل المبلغ</div>
            <div class="step-waiting px-4 py-2 rounded-full text-sm font-bold" id="step3">3. ارفع الوصل</div>
        </div>

        <!-- Step 1: Choose method -->
        <div id="step1Content" class="bg-white rounded-2xl shadow p-6 mb-4">
            <h2 class="font-bold text-lg mb-4">اختر طريقة الدفع:</h2>
            <div class="space-y-3" id="methodsContainer"></div>
        </div>

        <!-- Step 2: Instructions -->
        <div id="step2Content" class="bg-white rounded-2xl shadow p-6 mb-4 hidden">
            <h2 class="font-bold text-lg mb-4">تعليمات الدفع:</h2>
            <div id="instructions" class="bg-gray-50 rounded-xl p-4 mb-4"></div>
            <p class="text-sm text-red-600 mb-2">⚠️ تأكد من كتابة رقم الطلب في ملاحظات التحويل</p>
            <button onclick="goToStep3()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold hover:bg-indigo-700 transition">✅ تم الدفع — ارفع الوصل الآن</button>
        </div>

        <!-- Step 3: Upload receipt -->
        <div id="step3Content" class="bg-white rounded-2xl shadow p-6 mb-4 hidden">
            <h2 class="font-bold text-lg mb-4">📸 ارفع صورة الوصل:</h2>
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-indigo-400 transition cursor-pointer" id="dropZone">
                <input type="file" id="receiptInput" accept="image/*,.pdf" class="hidden">
                <div id="uploadPrompt">
                    <div class="text-4xl mb-2">📎</div>
                    <p class="text-gray-600">اسحب الصورة هنا أو اضغط للرفع</p>
                    <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF, WebP, PDF</p>
                </div>
                <div id="uploadPreview" class="hidden">
                    <img id="previewImg" class="max-h-48 mx-auto rounded-lg mb-2">
                    <p class="text-green-600 text-sm font-bold">✅ تم اختيار الملف</p>
                    <button onclick="resetUpload()" class="text-red-500 text-xs mt-1 underline">تغيير الملف</button>
                </div>
            </div>
            <button id="submitBtn" onclick="submitReceipt()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition mt-4 disabled:opacity-50" disabled>📤 إرسال الوصل</button>
            <div id="submitResult" class="mt-4 hidden"></div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-4 hidden">
            <div class="animate-spin inline-block w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full"></div>
            <p class="text-gray-600 mt-2">جارٍ المعالجة...</p>
        </div>

        <div class="text-center mt-6">
            <a href="/subscribe" class="text-indigo-600 hover:underline text-sm">🔙 العودة للباقات</a>
        </div>
    </div>

    <script>
        const planKey = window.location.pathname.split('/').pop();
        let paymentId = null;
        let userId = localStorage.getItem('yamen_user_id');
        let selectedFile = null;
        let selectedMethod = null;

        async function init() {
            if (!userId) {
                userId = 'web_' + crypto.randomUUID();
                localStorage.setItem('yamen_user_id', userId);
            }

            const res = await fetch('/api/plans');
            const data = await res.json();
            const plan = data.plans[planKey];
            if (!plan) { alert('باقة غير موجودة'); return; }

            document.getElementById('planName').textContent = plan.emoji + ' ' + plan.name + ' — ' + plan.price + ' دينار';
            document.title = plan.name + ' | الدفع';

            // Render payment methods
            const container = document.getElementById('methodsContainer');
            for (const [key, method] of Object.entries(data.payment_methods)) {
                container.innerHTML += 
                    <div class="border rounded-xl p-4 cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition method-card" onclick="selectMethod('')" data-method="">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl"></span>
                            <div>
                                <h3 class="font-bold"></h3>
                                <code class="text-sm bg-gray-100 px-2 py-0.5 rounded"></code>
                            </div>
                        </div>
                    </div>;
            }
        }

        async function selectMethod(methodKey) {
            selectedMethod = methodKey;
            document.querySelectorAll('.method-card').forEach(c => c.classList.remove('border-indigo-400', 'bg-indigo-50', 'ring-2', 'ring-indigo-400'));
            document.querySelector([data-method=""]).classList.add('border-indigo-400', 'bg-indigo-50', 'ring-2', 'ring-indigo-400');

            // Create payment
            document.getElementById('loading').classList.remove('hidden');
            const name = prompt('أدخل اسمك الكامل:') || 'مستخدم جديد';
            const pathType = confirm('هل أنت في المسار الأكاديمي؟\nOK = Academic | Cancel = General') ? 'academic' : 'general';
            const targetBand = parseFloat(prompt('الـ Band المستهدف (مثلاً 6.5):', '6.0')) || 6.0;
            const daysLeft = parseInt(prompt('كم يوماً لديك قبل الامتحان؟', '60')) || 60;

            const payRes = await fetch('/api/payment/create', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    user_id: userId, plan_key: planKey, method: methodKey,
                    name, path_type: pathType, target_band: targetBand, days_left: daysLeft
                })
            });
            const payData = await payRes.json();
            document.getElementById('loading').classList.add('hidden');

            if (payRes.ok) {
                paymentId = payData.payment_id;

                // Get method instructions
                const plansRes = await fetch('/api/plans');
                const allData = await plansRes.json();
                const method = allData.payment_methods[methodKey];

                const instrDiv = document.getElementById('instructions');
                if (method.needs_whatsapp) {
                    instrDiv.innerHTML = 
                        <p class="font-bold mb-2"> </p>
                        <p class="mb-2"></p>
                        <a href="https://wa.me/9627989919150" target="_blank" class="inline-block bg-green-500 text-white px-4 py-2 rounded-lg mt-2 hover:bg-green-600 transition">💬 تواصل واتساب</a>
                    ;
                } else {
                    instrDiv.innerHTML = 
                        <p class="font-bold mb-2"> </p>
                        <p>الرقم: <code class="bg-gray-200 px-2 rounded text-lg"></code></p>
                        <p class="mt-2 text-gray-600"></p>
                        <p class="mt-2 font-bold text-indigo-700">🔢 رقم الطلب: #</p>
                    ;
                }

                goToStep2();
            } else {
                alert(payData.error || 'حدث خطأ');
            }
        }

        function goToStep2() {
            document.getElementById('step1Content').classList.add('hidden');
            document.getElementById('step2Content').classList.remove('hidden');
            document.getElementById('step3Content').classList.add('hidden');
            document.getElementById('step1').className = 'step-done px-4 py-2 rounded-full text-sm font-bold';
            document.getElementById('step2').className = 'step-active px-4 py-2 rounded-full text-sm font-bold';
        }

        function goToStep3() {
            document.getElementById('step1Content').classList.add('hidden');
            document.getElementById('step2Content').classList.add('hidden');
            document.getElementById('step3Content').classList.remove('hidden');
            document.getElementById('step2').className = 'step-done px-4 py-2 rounded-full text-sm font-bold';
            document.getElementById('step3').className = 'step-active px-4 py-2 rounded-full text-sm font-bold';
        }

        // File upload
        document.getElementById('dropZone').addEventListener('click', () => document.getElementById('receiptInput').click());
        document.getElementById('receiptInput').addEventListener('change', handleFileSelect);
        document.getElementById('dropZone').addEventListener('dragover', e => { e.preventDefault(); e.currentTarget.classList.add('border-indigo-400'); });
        document.getElementById('dropZone').addEventListener('dragleave', e => e.currentTarget.classList.remove('border-indigo-400'));
        document.getElementById('dropZone').addEventListener('drop', e => {
            e.preventDefault();
            e.currentTarget.classList.remove('border-indigo-400');
            const files = e.dataTransfer.files;
            if (files.length) handleFiles(files[0]);
        });

        function handleFileSelect(e) { if (e.target.files.length) handleFiles(e.target.files[0]); }

        function handleFiles(file) {
            selectedFile = file;
            document.getElementById('uploadPrompt').classList.add('hidden');
            document.getElementById('uploadPreview').classList.remove('hidden');
            document.getElementById('submitBtn').disabled = false;
            if (file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = e => document.getElementById('previewImg').src = e.target.result;
                reader.readAsDataURL(file);
            } else {
                document.getElementById('previewImg').src = '';
                document.getElementById('previewImg').alt = file.name;
            }
        }

        function resetUpload() {
            selectedFile = null;
            document.getElementById('receiptInput').value = '';
            document.getElementById('uploadPrompt').classList.remove('hidden');
            document.getElementById('uploadPreview').classList.add('hidden');
            document.getElementById('submitBtn').disabled = true;
        }

        async function submitReceipt() {
            if (!selectedFile || !paymentId) return;
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('loading').classList.remove('hidden');

            const formData = new FormData();
            formData.append('receipt', selectedFile);
            formData.append('payment_id', paymentId);
            formData.append('user_id', userId);

            try {
                const res = await fetch('/api/payment/upload-receipt', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('submitResult').classList.remove('hidden');
                if (res.ok) {
                    document.getElementById('submitResult').innerHTML = 
                        <div class="bg-green-50 border border-green-200 rounded-xl p-4 text-center">
                            <div class="text-3xl mb-2">🎉</div>
                            <p class="font-bold text-green-700"></p>
                            <p class="text-sm text-green-600 mt-1">رقم الطلب: #</p>
                            <button onclick="checkStatus()" class="mt-3 bg-green-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-700">🔄 تحقق من حالة الطلب</button>
                            <a href="/" class="mt-3 inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-indigo-700">🏠 العودة للرئيسية</a>
                        </div>;
                    document.getElementById('step3').className = 'step-done px-4 py-2 rounded-full text-sm font-bold';
                } else {
                    document.getElementById('submitResult').innerHTML = <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center text-red-600">❌ </div>;
                    document.getElementById('submitBtn').disabled = false;
                }
            } catch(e) {
                document.getElementById('submitResult').innerHTML = <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-center text-red-600">❌ خطأ في الاتصال</div>;
                document.getElementById('submitBtn').disabled = false;
            }
            document.getElementById('loading').classList.add('hidden');
        }

        async function checkStatus() {
            const res = await fetch(/api/payment/status?user_id=&payment_id=);
            const data = await res.json();
            const statusMap = { 'pending': '⏳ قيد المراجعة', 'approved': '✅ تمت الموافقة', 'rejected': '❌ مرفوض' };
            alert(حالة الطلب: );
        }

        init();
    </script>
</body>
</html>
