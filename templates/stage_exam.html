<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحان المرحلة - أكاديمية يامن</title>
  <style>
    body{
      margin:0;
      font-family:Tahoma, Arial, sans-serif;
      background:#f5f7fb;
      color:#1f2937;
    }
    .topbar{
      background:#0f172a;
      color:#fff;
      padding:14px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .topbar .title{
      font-size:20px;
      font-weight:700;
    }
    .topbar .meta{
      font-size:14px;
      opacity:.9;
    }
    .wrap{
      max-width:1200px;
      margin:20px auto;
      padding:0 16px;
    }
    .card{
      background:#fff;
      border-radius:16px;
      box-shadow:0 6px 24px rgba(0,0,0,.08);
      padding:18px;
      margin-bottom:16px;
    }
    .loading{
      text-align:center;
      padding:60px 20px;
      color:#475569;
      font-size:20px;
    }
    .error{
      background:#fff1f2;
      color:#9f1239;
      border:1px solid #fecdd3;
      border-radius:12px;
      padding:14px;
      white-space:pre-wrap;
    }
    .layout{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap:16px;
    }
    @media (max-width: 900px){
      .layout{ grid-template-columns: 1fr; }
    }
    .passage{
      font-size:18px;
      line-height:2.2;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:18px;
      direction:ltr;
      text-align:left;
      min-height:220px;
    }
    .question-box{
      background:#ffffff;
      border:1px solid #e2e8f0;
      border-radius:12px;
      padding:16px;
    }
    .q-meta{
      color:#64748b;
      font-size:14px;
      margin-bottom:10px;
    }
    .q-title{
      font-size:18px;
      font-weight:700;
      margin-bottom:14px;
    }
    .ctw-blank{
      display:inline-flex;
      align-items:center;
      gap:2px;
      background:#fff;
      padding:4px 6px;
      border-radius:8px;
      border:1px solid #cbd5e1;
      margin:0 3px;
      vertical-align:middle;
    }
    .ctw-prefix{
      font-weight:700;
      color:#0f172a;
      min-width:12px;
    }
    .ctw-letter{
      width:26px;
      height:32px;
      text-align:center;
      border:none;
      border-bottom:2px solid #2563eb;
      background:transparent;
      font-size:16px;
      font-weight:700;
      color:#1d4ed8;
      outline:none;
    }
    .ctw-letter:focus{
      background:#dbeafe;
      border-bottom-color:#1e3a8a;
    }
.actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:16px;
    }
    button{
      border:none;
      border-radius:10px;
      padding:10px 16px;
      font-size:15px;
      cursor:pointer;
      font-weight:700;
    }
    .btn-primary{ background:#2563eb; color:#fff; }
    .btn-secondary{ background:#e2e8f0; color:#0f172a; }
    .btn-success{ background:#16a34a; color:#fff; }
    .btn-danger{ background:#dc2626; color:#fff; }
    button:disabled{ opacity:.5; cursor:not-allowed; }
    .status{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      font-size:14px;
      color:#475569;
      margin-bottom:12px;
    }
    .pill{
      background:#eef2ff;
      color:#3730a3;
      padding:6px 10px;
      border-radius:999px;
      font-weight:700;
    }
    .result{
      white-space:pre-wrap;
      background:#f8fafc;
      border:1px solid #cbd5e1;
      border-radius:12px;
      padding:14px;
      margin-top:16px;
      direction:ltr;
      text-align:left;
      font-size:13px;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="title">امتحان المرحلة #{{ stage_id }}</div>
    <div class="meta">user_id: {{ user_id }}</div>
  </div>

  <div class="wrap">
    <div id="app" class="card loading">جاري تحميل الامتحان...</div>
  </div>

  <script>
    const STAGE_ID = {{ stage_id }};
    const USER_ID = "{{ user_id }}";

    let examData = null;
    let questions = [];
    let currentIdx = 0;
    let answers = {};
    let startedAt = Date.now();

    function esc(s){
      if(s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
    }

    function showError(msg){
      const app = document.getElementById('app');
      app.className = 'card';
      app.innerHTML = '<div class="error">' + esc(msg) + '</div>';
    }

    function normalizeBlanks(raw){
      if(!raw) return [];
      let data = raw;
      try{
        if(typeof data === 'string') data = JSON.parse(data);
      }catch(e){
        return [];
      }

      if(Array.isArray(data)){
        return data.map((b, idx) => {
          const n = b.n || (idx + 1);
          const answer = b.answer || b.full || '';
          const prefix = b.prefix || '';
          const hint = b.hint || (answer ? answer.slice(0,3) + '...' : '');
          return { n, prefix, answer, full: answer, hint };
        });
      }

      if(data && typeof data === 'object'){
        return Object.entries(data).map(([masked, answer], idx) => {
          const prefix = masked.indexOf('_') >= 0 ? masked.split('_')[0] : '';
          const hint = answer ? String(answer).slice(0,3) + '...' : '';
          return {
            n: idx + 1,
            prefix: prefix,
            answer: String(answer || ''),
            full: String(answer || ''),
            hint: hint
          };
        });
      }

      return [];
    }

    async function fetchWithTimeout(url, options, ms){
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), ms || 12000);
      try{
        const res = await fetch(url, {...(options || {}), signal: controller.signal});
        return res;
      } finally {
        clearTimeout(timer);
      }
    }

    function collectCurrentCTW(){
      const q = questions[currentIdx];
      if(!q) return;
      const blanks = normalizeBlanks(q.blanks_json);
      const out = {};
      blanks.forEach(b => {
        const nodes = document.querySelectorAll('.ctw-letter[data-blank="' + b.n + '"]');
        let suffix = '';
        nodes.forEach(node => suffix += (node.value || ''));
        out[String(b.n)] = (b.prefix || '') + suffix;
      });
      answers[String(q.id)] = out;
    }

    function renderQuestion(){
      const app = document.getElementById('app');
      const q = questions[currentIdx];
      if(!q){
        showError('لا توجد أسئلة للعرض');
        return;
      }

      const blanks = normalizeBlanks(q.blanks_json);
      let passage = q.passage_text || '';
      const savedAns = answers[String(q.id)] || {};

      blanks.forEach(b => {
        const full = String(b.full || b.answer || '');
        const prefix = String(b.prefix || '');
        const missing = Math.max(0, full.length - prefix.length);
        const savedFull = savedAns[String(b.n)] || '';
        const savedSuffix = savedFull ? savedFull.substring(prefix.length) : '';
        let inputs = '';

        for(let i = 0; i < missing; i++){
          const ch = savedSuffix[i] || '';
          inputs += '<input class="ctw-letter" data-blank="' + b.n + '" data-idx="' + i + '" maxlength="1" autocomplete="off" value="' + esc(ch) + '">';
        }

        const hintSafe = esc(b.hint || '');
        const blankHtml =
          '<span class="ctw-blank" data-blank="' + b.n + '">' +
            '<span class="ctw-prefix">' + esc(prefix) + '</span>' +
            inputs +

          '</span>';

        passage = passage.replace('[B' + b.n + ']', blankHtml);
      });

      const total = questions.length;
      const isLast = currentIdx === total - 1;
      const isFirst = currentIdx === 0;

      app.className = 'card';
      app.innerHTML =
        '<div class="status">' +
          '<span class="pill">السؤال ' + (currentIdx + 1) + ' / ' + total + '</span>' +
          '<span class="pill">q_type: ' + esc(q.q_type || '') + '</span>' +
          '<span class="pill">set_id: ' + esc(q.set_id || '') + '</span>' +
        '</div>' +
        '<div class="layout">' +
          '<div class="card" style="margin:0">' +
            '<div class="q-title">النص</div>' +
            '<div class="passage">' + passage + '</div>' +
          '</div>' +
          '<div class="question-box">' +
            '<div class="q-meta">Question ID: ' + esc(q.id) + '</div>' +
            '<div class="q-title">' + esc(q.question_text || 'Complete the words in the passage') + '</div>' +
            '<div>أكمل الحروف الناقصة داخل النص، ثم انتقل للسؤال التالي.</div>' +
            '<div class="actions">' +
              '<button class="btn-secondary" id="prevBtn" ' + (isFirst ? 'disabled' : '') + '>السابق</button>' +
              '<button class="btn-primary" id="nextBtn">' + (isLast ? 'مراجعة' : 'التالي') + '</button>' +
              '<button class="btn-success" id="submitBtn">تسليم الامتحان</button>' +
              '<button class="btn-danger" id="reloadBtn">إعادة التحميل</button>' +
            '</div>' +
            '<div id="submitResult" class="result" style="display:none"></div>' +
          '</div>' +
        '</div>';
document.querySelectorAll('.ctw-letter').forEach(el => {
        el.addEventListener('input', function(){
          if(this.value && this.value.length > 1){
            this.value = this.value.slice(-1);
          }
          collectCurrentCTW();
        });
      });

      document.getElementById('prevBtn').addEventListener('click', function(){
        collectCurrentCTW();
        if(currentIdx > 0){
          currentIdx--;
          renderQuestion();
        }
      });

      document.getElementById('nextBtn').addEventListener('click', function(){
        collectCurrentCTW();
        if(currentIdx < questions.length - 1){
          currentIdx++;
          renderQuestion();
        } else {
          alert('تم حفظ الإجابات الحالية. يمكنك الآن التسليم.');
        }
      });

      document.getElementById('submitBtn').addEventListener('click', submitExam);
      document.getElementById('reloadBtn').addEventListener('click', function(){
        location.reload();
      });
    }


    function renderSubmitResultFromText(text){
      const box = document.getElementById('submitResult');
      box.style.display = 'block';

      let data = null;
      try{
        data = JSON.parse(text);
      }catch(e){
        box.textContent = text;
        return;
      }

      const feedback = (data && data.feedback) ? data.feedback : {};
      const details = Array.isArray(feedback.blanks_detail) ? feedback.blanks_detail : [];

      let html = '';
      html += '<div style="font-weight:700;font-size:18px;margin-bottom:10px">تم تسليم الامتحان</div>';

      if(data.score !== undefined){
        html += '<div><b>الدرجة:</b> ' + esc(data.score) + '</div>';
      }
      if(data.correct !== undefined){
        html += '<div><b>عدد الصحيح:</b> ' + esc(data.correct) + '</div>';
      }
      if(data.total !== undefined){
        html += '<div><b>إجمالي العناصر:</b> ' + esc(data.total) + '</div>';
      }
      if(data.required_score !== undefined){
        html += '<div><b>درجة النجاح المطلوبة:</b> ' + esc(data.required_score) + '</div>';
      }
      if(data.passed !== undefined){
        html += '<div><b>حالة النجاح:</b> ' + (data.passed ? 'ناجح' : 'غير ناجح') + '</div>';
      }
      if(data.message){
        html += '<div><b>الرسالة:</b> ' + esc(data.message) + '</div>';
      }

      if(details.length){
        html += '<hr style="margin:12px 0">';
        html += '<div style="font-weight:700;margin-bottom:8px">تفاصيل الفراغات</div>';
        html += '<div style="max-height:320px;overflow:auto;border:1px solid #cbd5e1;border-radius:10px;padding:10px;background:#fff">';
        details.forEach(function(d, idx){
          html += '<div style="padding:8px 0;border-bottom:1px solid #e5e7eb">';
          html += '<div><b>#' + (idx + 1) + '</b></div>';
          if(d.expected !== undefined) html += '<div><b>المتوقع:</b> ' + esc(d.expected) + '</div>';
          if(d.given !== undefined) html += '<div><b>إجابتك:</b> ' + esc(d.given) + '</div>';
          if(d.is_correct !== undefined) html += '<div><b>النتيجة:</b> ' + (d.is_correct ? 'صحيح' : 'خطأ') + '</div>';

          html += '</div>';
        });
        html += '</div>';
      } else {
        html += '<hr style="margin:12px 0">';
        html += '<div><b>الرد الكامل:</b></div>';
        html += '<pre style="white-space:pre-wrap;direction:ltr;text-align:left;background:#fff;padding:10px;border:1px solid #cbd5e1;border-radius:10px">' + esc(JSON.stringify(data, null, 2)) + '</pre>';
      }

      box.innerHTML = html;
    }


    async function submitExam(){
      try{
        collectCurrentCTW();
        const payload = {
          user_id: USER_ID,
          telegram_id: USER_ID,
          answers: answers
        };

        let res = await fetchWithTimeout('/api/student/stage/' + STAGE_ID + '/exam-submit-v2', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        }, 15000);

        if(!res.ok){
          res = await fetchWithTimeout('/api/student/stage/' + STAGE_ID + '/exam-submit', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify(payload)
          }, 15000);
        }

        const text = await res.text();
        renderSubmitResultFromText(text);
      }catch(err){
        const box = document.getElementById('submitResult');
        if(box){
          box.style.display = 'block';
          box.textContent = 'SUBMIT ERROR: ' + err;
        }else{
          alert('SUBMIT ERROR: ' + err);
        }
      }
    }

    async function boot(){
      try{
        if(!USER_ID){
          showError('user_id غير موجود في الرابط. افتح الصفحة بهذا الشكل: /stage-exam/5?user_id=5572314718');
          return;
        }

        const res = await fetchWithTimeout('/api/student/stage/' + STAGE_ID + '/exam-start?user_id=' + encodeURIComponent(USER_ID), {}, 15000);
        const text = await res.text();

        let data = null;
        try{
          data = JSON.parse(text);
        }catch(e){
          showError('API returned non-JSON response:\n\n' + text);
          return;
        }

        if(!data.success){
          showError('API error:\n\n' + JSON.stringify(data, null, 2));
          return;
        }

        examData = data;
        questions = Array.isArray(data.questions) ? data.questions : [];
        if(!questions.length){
          showError('الـ API عاد بدون أسئلة.');
          return;
        }

        renderQuestion();
      }catch(err){
        showError('BOOT ERROR:\n\n' + err);
      }
    }

    boot();
  </script>
</body>
</html>
