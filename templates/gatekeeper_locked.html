<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الاختبار مقفل — {{ stage.code }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', 'Tajawal', 'Tahoma', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #2d3748;
  }
  .card {
    background: #fff; border-radius: 24px;
    padding: 44px 36px; max-width: 520px; width: 100%;
    text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    animation: pop 0.4s cubic-bezier(.4,0,.2,1);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
  .lock-icon {
    font-size: 80px; margin-bottom: 20px;
    display: inline-block; animation: shake 2s ease-in-out infinite;
  }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
  h2 { color: #2d3748; margin-bottom: 12px; font-size: 24px; font-weight: 700; }
  .stage-name { color: #ed8936; font-weight: 700; }
  p { color: #718096; margin-bottom: 20px; line-height: 1.7; font-size: 15px; }
  .progress-wrap {
    background: #edf2f7; height: 14px; border-radius: 999px;
    overflow: hidden; margin: 24px 0 12px;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
  }
  .progress-fill {
    background: linear-gradient(90deg, #48bb78, #38a169);
    height: 100%; border-radius: 999px;
    transition: width 0.6s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 2px 8px rgba(72,187,120,0.4);
  }
  .progress-text {
    font-size: 14px; color: #4a5568; margin-bottom: 28px;
  }
  .progress-text strong { color: #2d3748; font-size: 17px; }
  .btn {
    display: inline-block; padding: 14px 32px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border-radius: 14px; text-decoration: none;
    font-weight: 600; font-size: 15px;
    box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    transition: all 0.2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(102,126,234,0.5); }
</style>
</head>
<body>
<div class="card">
  <div class="lock-icon">🔒</div>
  <h2>الاختبار مقفل</h2>
  <p>يجب إكمال جميع دروس <span class="stage-name">{{ stage.name_ar }}</span> قبل أن تتمكن من خوض اختبار نهاية المرحلة.</p>
  <div class="progress-wrap">
    <div class="progress-fill" style="width: {{ ((done/total)*100) if total else 0 }}%"></div>
  </div>
  <div class="progress-text">
    <strong>{{ done }}</strong> من <strong>{{ total }}</strong> دروس مكتملة
  </div>
  <a class="btn" href="/foundation/stage/{{ stage.id }}?user_id={{ user_id }}">📖 العودة لقائمة الدروس</a>
</div>
</body>
</html>
