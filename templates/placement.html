<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Test - Yamen Academy</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Tahoma,sans-serif; background:linear-gradient(135deg,#e0f2fe,#f0f9ff,#faf5ff); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.card { background:#fff; border-radius:22px; box-shadow:0 12px 40px rgba(99,102,241,.15); width:100%; max-width:540px; overflow:hidden; border:1px solid #e0e7ff; }
.head { background:linear-gradient(135deg,#60a5fa,#a78bfa); color:#fff; padding:24px; }
.head h1 { font-size:21px; font-weight:700; }
.head p { font-size:13px; opacity:.95; margin-top:5px; }
.progress-wrap { height:7px; background:rgba(255,255,255,.35); border-radius:4px; margin-top:16px; overflow:hidden; }
.progress { height:100%; background:#fff; width:0; transition:width .35s; border-radius:4px; }
.body { padding:30px 26px; }
.qcount { font-size:13px; color:#8b5cf6; font-weight:700; margin-bottom:10px; text-align:left; }
.question { font-size:18px; font-weight:600; color:#1e293b; line-height:1.55; margin-bottom:24px; text-align:left; white-space:pre-line; }
.opt { display:flex; align-items:center; gap:13px; padding:16px; border:2px solid #e2e8f0; border-radius:13px; margin-bottom:12px; cursor:pointer; transition:all .2s; background:#fff; }
.opt:hover { border-color:#c4b5fd; background:#faf5ff; }
.opt.sel { border-color:#8b5cf6; background:#f3e8ff; }
.opt .letter { width:32px; height:32px; flex-shrink:0; border-radius:50%; background:#eef2ff; color:#6366f1; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:15px; }
.opt.sel .letter { background:#8b5cf6; color:#fff; }
.opt .txt { font-size:15px; color:#334155; }
.btn { width:100%; padding:16px; border:none; border-radius:13px; background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px; transition:opacity .2s; }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.result { text-align:center; padding:36px 26px; display:none; }
.level-name { font-size:15px; color:#64748b; font-weight:600; }
.level-badge { display:inline-block; font-size:50px; font-weight:900; color:#8b5cf6; margin:8px 0; }
.level-cefr { display:inline-block; background:#f3e8ff; color:#8b5cf6; padding:7px 20px; border-radius:22px; font-weight:700; font-size:15px; margin-bottom:22px; }
.plan { background:#f8fafc; border:1px solid #e2e8f0; border-radius:15px; padding:20px; text-align:right; margin-bottom:20px; font-size:14px; color:#334155; line-height:1.8; direction:rtl; }
.plan b { color:#6366f1; }
.offer { background:linear-gradient(135deg,#fbbf24,#fb7185); color:#fff; border-radius:15px; padding:17px; margin-bottom:16px; font-weight:700; font-size:15px; }
.cta { display:block; width:100%; padding:16px; border-radius:13px; background:linear-gradient(135deg,#22c55e,#16a34a); color:#fff; font-size:16px; font-weight:700; text-decoration:none; margin-bottom:11px; }
.cta2 { display:block; width:100%; padding:15px; border-radius:13px; background:#6366f1; color:#fff; font-size:15px; font-weight:600; text-decoration:none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>English Placement Test</h1>
    <p>24 questions - No time limit - Find your CEFR level</p>
    <div class="progress-wrap"><div class="progress" id="bar"></div></div>
  </div>
  <div class="body" id="quiz">
    <div class="qcount" id="qc">Question 1 of 24</div>
    <div class="question" id="q"></div>
    <div id="opts"></div>
    <button class="btn" id="next" disabled>Next</button>
  </div>
  <div class="result" id="res">
    <div class="level-name">Your English Level</div>
    <div class="level-badge" id="r-cefr">B1</div>
    <div class="level-cefr" id="r-name">Intermediate</div>
    <div class="plan" id="r-plan"></div>
    <div class="offer">🔥 عرض خاص: خصم يصل إلى 50% لفترة محدودة!</div>
    <a class="cta" id="r-register" href="#">🎯 سجّل الآن واحصل على خصم 50%</a>
    <a class="cta2" id="r-packages" href="/miniapp/plans">📦 عرض الباقات والعروض</a>
  </div>
</div>
<script>
const QUESTIONS = [
  {lv:"A1",q:"Choose the correct word:\n\nThis ___ a book.",o:["is","are","am","be"],a:0},
  {lv:"A1",q:"What is the opposite of \"big\"?",o:["tall","small","long","wide"],a:1},
  {lv:"A1",q:"Choose:\n\nI ___ a student.",o:["is","are","am","be"],a:2},
  {lv:"A1",q:"\"Apple\" is a kind of:",o:["animal","fruit","color","car"],a:1},
  {lv:"A2",q:"Choose:\n\nShe ___ to school every day.",o:["go","goes","going","gone"],a:1},
  {lv:"A2",q:"What does \"happy\" mean?",o:["sad","angry","glad","tired"],a:2},
  {lv:"A2",q:"Choose the past tense:\n\nYesterday I ___ to the park.",o:["go","went","gone","going"],a:1},
  {lv:"A2",q:"Choose:\n\nHe is reading a ___.",o:["book","eat","run","fast"],a:0},
  {lv:"B1",q:"Choose:\n\nIf it rains, I ___ stay home.",o:["will","would","was","am"],a:0},
  {lv:"B1",q:"What does \"benefit\" mean?",o:["harm","advantage","danger","problem"],a:1},
  {lv:"B1",q:"Choose:\n\nThe report ___ by the manager yesterday.",o:["wrote","was written","is writing","writes"],a:1},
  {lv:"B1",q:"\"Despite the heavy rain, the match continued.\"\n\nThis means:",o:["The rain stopped the match","The match was cancelled","The match went on even though it rained","There was no rain"],a:2},
  {lv:"B2",q:"Choose:\n\nIf I ___ rich, I would travel the world.",o:["am","was","were","be"],a:2},
  {lv:"B2",q:"Choose the synonym of \"significant\":",o:["small","important","easy","quick"],a:1},
  {lv:"B2",q:"Choose the opposite of \"abundant\":",o:["plentiful","scarce","rich","full"],a:1},
  {lv:"B2",q:"\"The researcher's findings were inconclusive.\"\n\nThis means:",o:["The results were very clear","No clear conclusion was reached","The research was successful","The findings were published"],a:1},
  {lv:"C1",q:"Choose the meaning of \"elaborate\" (verb):",o:["to summarize briefly","to explain in detail","to ignore","to repeat"],a:1},
  {lv:"C1",q:"Choose:\n\nHardly ___ he arrived when the meeting started.",o:["has","had","did","was"],a:1},
  {lv:"C1",q:"\"Meticulous\" most nearly means:",o:["careless","extremely careful","lazy","fast"],a:1},
  {lv:"C1",q:"\"Her argument, while compelling, rested on flawed premises.\"\n\nThe argument was:",o:["completely wrong","persuasive but based on errors","perfectly logical","too short"],a:1},
  {lv:"C2",q:"\"Ubiquitous\" means:",o:["rare","present everywhere","ancient","hidden"],a:1},
  {lv:"C2",q:"Choose:\n\nWere it not for your help, I ___ failed.",o:["will have","would have","have","had"],a:1},
  {lv:"C2",q:"\"To exacerbate\" a problem means to:",o:["solve it","make it worse","ignore it","explain it"],a:1},
  {lv:"C2",q:"\"The policy was ostensibly about safety, but its real aim was control.\"\n\n\"Ostensibly\" implies the safety reason was:",o:["the true reason","the apparent but not real reason","unimportant","illegal"],a:1}
];
const ADMIN_CONTACT = "https://t.me/YamenAcademy_Bot";
// خلط الخيارات لكل سؤال مع تتبع الإجابة الصحيحة
QUESTIONS.forEach(item=>{
  const correctText=item.o[item.a];
  for(let i=item.o.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [item.o[i],item.o[j]]=[item.o[j],item.o[i]]; }
  item.a=item.o.indexOf(correctText);
});
let idx=0, sel=null;
const perLevel={A1:[0,0],A2:[0,0],B1:[0,0],B2:[0,0],C1:[0,0],C2:[0,0]};
function render(){
  const item=QUESTIONS[idx];
  document.getElementById("qc").textContent="Question "+(idx+1)+" of "+QUESTIONS.length;
  document.getElementById("q").textContent=item.q;
  document.getElementById("bar").style.width=(idx/QUESTIONS.length*100)+"%";
  const box=document.getElementById("opts"); box.innerHTML="";
  const L=["A","B","C","D"];
  item.o.forEach((opt,i)=>{
    const d=document.createElement("div"); d.className="opt";
    d.innerHTML='<div class="letter">'+L[i]+'</div><div class="txt">'+opt+'</div>';
    d.onclick=()=>{ sel=i; [...box.children].forEach(c=>c.classList.remove("sel")); d.classList.add("sel"); document.getElementById("next").disabled=false; };
    box.appendChild(d);
  });
  sel=null; document.getElementById("next").disabled=true;
  document.getElementById("next").textContent=(idx===QUESTIONS.length-1)?"Finish ✓":"Next";
}
document.getElementById("next").onclick=()=>{
  const item=QUESTIONS[idx];
  perLevel[item.lv][1]++;
  if(sel===item.a) perLevel[item.lv][0]++;
  idx++;
  if(idx<QUESTIONS.length){ 
async function saveCefr(sid, cefr){
  if(!sid){ return; }
  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  let nm = "", un = "";
  try{
    if(tg && tg.initDataUnsafe && tg.initDataUnsafe.user){
      nm = ((tg.initDataUnsafe.user.first_name||"")+" "+(tg.initDataUnsafe.user.last_name||"")).trim();
      un = tg.initDataUnsafe.user.username||"";
    }
  }catch(e){}
  const payload = JSON.stringify({student_id:sid,cefr:cefr,name:nm,username:un});
  for(let attempt=0; attempt<4; attempt++){
    try{
      const resp = await fetch("/api/placement/save-cefr",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:payload,
        keepalive:true
      });
      if(resp.ok){
        const d = await resp.json();
        if(d && d.ok){ return; }
      }
    }catch(e){}
    await new Promise(r=>setTimeout(r, 1200*(attempt+1)));
  }
}
render(); } else { finish(); }
};
function finish(){
  const order=["A1","A2","B1","B2","C1","C2"];
  let cefr="A1";
  for(const lv of order){
    const[c,t]=perLevel[lv];
    if(t>0&&c>=3) cefr=lv;
    else if(t>0&&c<2) break;
  }
  const names={A1:"Beginner",A2:"Elementary",B1:"Intermediate",B2:"Upper-Intermediate",C1:"Advanced",C2:"Proficient"};
  let plan="";
  if(cefr==="A1"||cefr==="A2"){
    plan="🛠️ <b>خطة دراستك: التأسيس من البداية</b><br>ستبدأ من المرحلة الأولى للتأسيس لبناء القواعد والمفردات خطوة بخطوة، ثم تنتقل للقراءة والاستماع.";
  } else if(cefr==="B1"){
    plan="📘 <b>خطة دراستك: تقوية ثم انطلاق</b><br>أساسياتك جيدة! ستبدأ من مراحل التأسيس المتقدمة لسدّ الثغرات، ثم تنتقل سريعاً إلى TOEFL.";
  } else if(cefr==="B2"){
    plan="🎯 <b>خطة دراستك: TOEFL مباشرة</b><br>مستواك جيد جداً! ستتخطى التأسيس وتبدأ من القراءة والاستماع في TOEFL مباشرة.";
  } else {
    plan="🏆 <b>خطة دراستك: TOEFL متقدم</b><br>مستواك ممتاز! ستركّز على النقاط الدقيقة التي ترفع علامتك إلى أعلى نطاق.";
  }
  document.getElementById("quiz").style.display="none";
  document.getElementById("bar").style.width="100%";
  document.getElementById("r-cefr").textContent=cefr;
  document.getElementById("r-name").textContent=names[cefr];
  document.getElementById("r-plan").innerHTML=plan;
  const sid=new URLSearchParams(location.search).get("student_id")||new URLSearchParams(location.search).get("user_id")||"";
  document.getElementById("r-register").href="/miniapp/plans?student_id="+sid;
  document.getElementById("res").style.display="block";
  saveCefr(sid, cefr);
}
render();
</script>
</body>
</html>
