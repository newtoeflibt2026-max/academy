<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>اختبار تحديد المستوى | أكاديمية يامن</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { font-family: "Cairo", sans-serif; }
  body { background: #fdfcfb; }
  .card { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border: 1px solid rgba(197,160,40,0.2); border-radius: 24px; }
  .btn-primary { background: linear-gradient(135deg, #1a365d, #2a4a7f); color: #fff; border-radius: 16px; padding: 14px 28px; font-weight: 700; cursor: pointer; transition: all 0.3s; border: none; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26,54,93,0.3); }
  .gold { color: #c5a028; } .navy { color: #1a365d; }
  .option-btn { background: #fff; border: 2px solid #e5e7eb; border-radius: 16px; padding: 14px; text-align: right; cursor: pointer; transition: all 0.2s; display: block; width: 100%; }
  .option-btn:hover { border-color: #c5a028; background: #fef9e7; }
  .option-btn.selected { border-color: #1a365d; background: #e8edf5; }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<!-- Start Screen -->
<div id="startScreen" class="card p-8 max-w-md w-full text-center">
  <div class="text-6xl mb-4">📝</div>
  <h1 class="text-2xl font-extrabold navy mb-2">اختبار تحديد المستوى</h1>
  <p class="text-gray-600 mb-6">10 أسئلة اختيارية • 6 دقائق • مستوى TOEFL</p>
  <div class="space-y-3 text-right text-sm text-gray-500 mb-8">
    <p>✅ التصنيف: ضعيف (0-3) / متوسط (4-7) / متقدم (8-10)</p>
    <p>✅ لا يمكن تخطي الاختبار</p>
    <p>✅ الإكمال إجباري للدخول إلى الداشبورد</p>
  </div>
  <button onclick="startTest()" class="btn-primary w-full text-lg">ابدأ الاختبار الآن</button>
</div>

<!-- Test Screen -->
<div id="testScreen" class="card p-6 max-w-lg w-full hidden">
  <div class="flex justify-between items-center mb-4">
    <span class="navy font-bold text-lg">السؤال <span id="currentQ">1</span>/<span id="totalQ">10</span></span>
    <span class="gold font-bold text-2xl" id="timer">6:00</span>
  </div>
  <div class="w-full bg-gray-200 rounded-full h-3 mb-6">
    <div id="progressBar" class="h-3 rounded-full transition-all duration-500" style="width:0%; background: linear-gradient(90deg, #1a365d, #c5a028);"></div>
  </div>
  <h2 id="questionText" class="text-xl font-bold navy mb-6 leading-relaxed"></h2>
  <div id="optionsContainer" class="space-y-3"></div>
  <div class="flex gap-3 mt-8">
    <button id="prevBtn" onclick="prevQuestion()" class="hidden flex-1 py-3 border-2 border-gray-300 rounded-xl font-bold text-gray-600 bg-white">السابق</button>
    <button onclick="nextQuestion()" class="btn-primary flex-1" id="nextBtn">التالي</button>
  </div>
</div>

<!-- Result Screen -->
<div id="resultScreen" class="card p-8 max-w-md w-full text-center hidden">
  <div class="text-6xl mb-4" id="resultEmoji">🎉</div>
  <h1 class="text-2xl font-extrabold navy mb-2">اكتمل الاختبار!</h1>
  <div class="text-4xl font-extrabold gold my-4" id="resultLevel"></div>
  <p class="text-gray-600 mb-2">النتيجة: <span id="resultScore" class="font-bold navy"></span></p>
  <p class="text-sm text-gray-400 mb-8">سيتم توجيهك إلى لوحة التحكم...</p>
  <button onclick="goToDashboard()" class="btn-primary w-full">انتقل إلى الداشبورد</button>
</div>

<script>
const USER_ID = new URLSearchParams(location.search).get("user_id") || "5602495831";
let questions = [], currentIndex = 0, answers = {}, timer = null, timeLeft = 360; // 6 minutes

async function startTest() {
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("testScreen").classList.remove("hidden");
  try {
    const res = await fetch("/api/placement/questions");
    const all = await res.json();
    questions = all.sort(() => Math.random() - 0.5);
    document.getElementById("totalQ").textContent = questions.length;
    startTimer();
    renderQuestion();
  } catch(e) {
    alert("خطأ في تحميل الأسئلة: " + e.message);
  }
}

function startTimer() {
  timer = setInterval(() => {
    timeLeft--;
    const m = Math.floor(timeLeft/60), s = timeLeft%60;
    document.getElementById("timer").textContent = `${m}:${s.toString().padStart(2,"0")}`;
    if (timeLeft <= 0) { clearInterval(timer); submitTest(); }
  }, 1000);
}

function renderQuestion() {
  if (currentIndex >= questions.length) { submitTest(); return; }
  const q = questions[currentIndex];
  document.getElementById("currentQ").textContent = currentIndex + 1;
  document.getElementById("questionText").textContent = q.question_text;
  document.getElementById("progressBar").style.width = ((currentIndex/questions.length)*100) + "%";
  const opts = document.getElementById("optionsContainer");
  opts.innerHTML = "";
  ["A","B","C","D"].forEach(letter => {
    const text = q["option_"+letter.toLowerCase()];
    if (!text) return;
    const btn = document.createElement("button");
    btn.className = "option-btn " + (answers[q.id] === letter ? "selected" : "");
    btn.innerHTML = `<span class="inline-block w-8 h-8 rounded-full border-2 ${answers[q.id]===letter?'bg-navy text-white border-navy':'border-gray-300'} text-center leading-7 ml-3 font-bold text-sm" style="color:${answers[q.id]===letter?'#fff':'#6b7280'}">${letter}</span>${text}`;
    btn.onclick = () => { answers[q.id] = letter; renderQuestion(); };
    opts.appendChild(btn);
  });
  document.getElementById("prevBtn").classList.toggle("hidden", currentIndex === 0);
  document.getElementById("nextBtn").textContent = currentIndex === questions.length - 1 ? "إنهاء الاختبار" : "التالي";
}

function prevQuestion() { if (currentIndex > 0) { currentIndex--; renderQuestion(); } }
function nextQuestion() { currentIndex++; renderQuestion(); }

async function submitTest() {
  clearInterval(timer);
  document.getElementById("testScreen").classList.add("hidden");
  document.getElementById("resultScreen").classList.remove("hidden");
  try {
    const res = await fetch("/api/placement/submit", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ student_id: USER_ID, answers: answers })
    });
    const data = await res.json();
    const emojis = { "متقدم (Advanced)": "🏆", "متوسط (Intermediate)": "🌟", "ضعيف (Beginner)": "📚" };
    document.getElementById("resultEmoji").textContent =
      Object.entries(emojis).find(([k])=>data.level.includes(k.split(" ")[0]))?.[1] || "🎉";
    document.getElementById("resultLevel").textContent = data.level;
    document.getElementById("resultScore").textContent = `${data.score}/${data.total} (${data.percentage}%)`;
    setTimeout(goToDashboard, 5000);
  } catch(e) {
    alert("خطأ في حفظ النتيجة: " + e.message);
  }
}

function goToDashboard() {
  location.href = `/dashboard/${USER_ID}`;
}
</script>
</body>
</html>
