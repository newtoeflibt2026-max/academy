<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fdfcfb">
    <title>يامن أكاديمي | امتحان المستوى</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script>tailwind.config={theme:{extend:{fontFamily:{'cairo':['Cairo','sans-serif']},colors:{'pearl':'#fdfcfb','royal':'#1a365d','gold':'#c5a028'}}}}</script>
    <style>
        *{font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
        body{background:radial-gradient(ellipse at 20% 0%,rgba(197,160,40,0.04),transparent 60%),linear-gradient(180deg,#fdfcfb,#f7f4ef);min-height:100vh}
        .glass-card{background:rgba(255,255,255,0.78);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.9);box-shadow:0 4px 20px rgba(26,54,93,0.06);border-radius:24px}
        .option-btn{width:100%;text-align:right;background:rgba(255,255,255,0.85);border:1.5px solid rgba(26,54,93,0.1);border-radius:16px;padding:14px 18px;font-weight:600;font-size:0.95rem;color:#1a365d;cursor:pointer;transition:all 0.3s;margin-bottom:8px}
        .option-btn:active,.option-btn.selected{background:rgba(197,160,40,0.08);border-color:#c5a028}
        .option-btn.correct{background:rgba(34,197,94,0.12);border-color:#22c55e;color:#166534}
        .option-btn.wrong{background:rgba(239,68,68,0.1);border-color:#ef4444;color:#991b1b}
        .timer-ring{transition:stroke-dashoffset 1s linear}
        @keyframes pulse-danger{0%,100%{color:#ef4444}50%{color:#dc2626}}
        .timer-danger{animation:pulse-danger 0.8s infinite}
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
<div class="w-full max-w-lg">

    <!-- ═══ شاشة البداية ═══ -->
    <div id="startScreen" class="glass-card p-8 text-center">
        <div class="text-6xl mb-4">🌍</div>
        <h1 class="text-2xl font-black text-royal mb-3">امتحان تحديد المستوى</h1>
        <p class="text-gray-500 text-sm mb-2 font-semibold">دورة التوفل الدولي TOEFL iBT</p>
        <div class="bg-royal/5 rounded-2xl p-4 my-5 text-sm text-royal/70 font-semibold text-right space-y-2">
            <p>📋 10 أسئلة اختيار من متعدد</p>
            <p>⏱️ الوقت الكلي: 10 دقائق</p>
            <p>✅ تصحيح فوري بعد الانتهاء</p>
            <p>🏆 تصنيف: مبتدئ / متوسط / متقدم</p>
            <p class="text-red-400">⚠️ لا يمكن تخطي الامتحان</p>
        </div>
        <button class="w-full bg-gradient-to-r from-royal to-blue-800 text-white font-extrabold py-3.5 rounded-2xl text-lg shadow-lg" onclick="startExam()">
            🚀 ابدأ الامتحان الآن
        </button>
    </div>

    <!-- ═══ شاشة الامتحان ═══ -->
    <div id="examScreen" style="display:none">
        <div class="glass-card p-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <span class="text-sm font-bold text-gray-400">سؤال <span id="currentQ">1</span>/<span id="totalQ">10</span></span>
                </div>
                <div class="flex items-center gap-2">
                    <svg class="w-10 h-10" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="none" stroke="rgba(26,54,93,0.08)" stroke-width="3"/><circle cx="22" cy="22" r="20" fill="none" stroke="#c5a028" stroke-width="3" stroke-dasharray="125.66" stroke-dashoffset="0" stroke-linecap="round" class="timer-ring" id="timerRing"/></svg>
                    <span class="text-xl font-black text-royal" id="timerDisplay">10:00</span>
                </div>
            </div>
            <div class="w-full bg-gray-100 h-1.5 rounded-full mb-5 overflow-hidden"><div class="h-full bg-gradient-to-r from-gold to-royal rounded-full transition-all" id="progressBar" style="width:0%"></div></div>
            <p class="text-royal font-extrabold text-base mb-5" id="questionText">جاري التحميل...</p>
            <div id="optionsContainer"></div>
            <div class="flex gap-3 mt-5">
                <button class="flex-1 bg-royal text-white font-extrabold py-3 rounded-2xl text-sm" id="nextBtn" onclick="nextQuestion()" disabled>التالي ←</button>
                <button class="bg-red-500 text-white font-extrabold py-3 px-5 rounded-2xl text-sm" onclick="finishEarly()">إنهاء ✕</button>
            </div>
        </div>
    </div>

    <!-- ═══ شاشة النتيجة ═══ -->
    <div id="resultScreen" style="display:none" class="glass-card p-8 text-center">
        <div id="resultIcon" class="text-7xl mb-4"></div>
        <h1 class="text-2xl font-black text-royal mb-2" id="resultLevel"></h1>
        <div class="text-6xl font-black text-gold my-3" id="resultScore"></div>
        <p class="text-gray-500 mb-1 font-semibold" id="resultDetail"></p>
        <p class="text-sm text-gold font-extrabold mb-5" id="resultXP"></p>
        <div id="skillBreakdown" class="text-xs text-gray-400 mb-5"></div>
        <button class="w-full bg-gradient-to-r from-gold to-yellow-600 text-white font-extrabold py-3.5 rounded-2xl text-lg shadow-lg" onclick="goToDashboard()">
            🎯 انتقل إلى المنصة
        </button>
    </div>

</div>

<script>
let questions=[],currentIndex=0,answers=[],totalTime=600,timeLeft=600,timerInterval=null;
const STUDENT_ID = {{ request.args.get('user_id', 0) or 0 }};

async function startExam(){
    document.getElementById('startScreen').style.display='none';
    document.getElementById('examScreen').style.display='block';
    try{
        const r=await fetch('/placement/api/questions');const d=await r.json();
        questions=d.questions;totalTime=d.total_time||600;timeLeft=totalTime;
        document.getElementById('totalQ').textContent=questions.length;
        showQuestion(0);startTimer();
    }catch(e){alert('فشل تحميل الأسئلة')}
}

function showQuestion(idx){
    if(idx>=questions.length){submitExam();return}
    currentIndex=idx;
    const q=questions[idx];
    document.getElementById('currentQ').textContent=idx+1;
    document.getElementById('questionText').textContent=q.question_text;
    document.getElementById('progressBar').style.width=((idx)/questions.length*100)+'%';
    document.getElementById('nextBtn').disabled=true;
    const opts=document.getElementById('optionsContainer');
    opts.innerHTML='';
    ['a','b','c','d'].forEach(letter=>{
        const btn=document.createElement('div');
        btn.className='option-btn';btn.textContent=letter.toUpperCase()+'. '+q['option_'+letter];
        btn.onclick=()=>{
            document.querySelectorAll('.option-btn').forEach(b=>b.classList.remove('selected'));
            btn.classList.add('selected');answers[idx]={question_id:q.id,selected_option:letter.toUpperCase()};
            document.getElementById('nextBtn').disabled=false;
        };
        opts.appendChild(btn)
    })
}

function nextQuestion(){showQuestion(currentIndex+1)}

function startTimer(){
    updateTimerDisplay();
    timerInterval=setInterval(()=>{
        timeLeft--;updateTimerDisplay();
        if(timeLeft<=0)submitExam();
        if(timeLeft<=60)document.getElementById('timerDisplay').classList.add('timer-danger');
    },1000)
}

function updateTimerDisplay(){
    const m=Math.floor(timeLeft/60),s=timeLeft%60;
    document.getElementById('timerDisplay').textContent=m+':'+(s<10?'0':'')+s;
    const ring=document.getElementById('timerRing');
    if(ring)ring.style.strokeDashoffset=125.66*(1-timeLeft/totalTime);
}

async function submitExam(){
    clearInterval(timerInterval);
    document.getElementById('examScreen').style.display='none';
    document.getElementById('resultScreen').style.display='block';
    try{
        const r=await fetch('/placement/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({user_id:STUDENT_ID,answers:answers.filter(a=>a)})});
        const d=await r.json();
        document.getElementById('resultScore').textContent=d.score_percent+'%';
        document.getElementById('resultDetail').textContent=d.correct+'/'+d.total+' إجابات صحيحة';
        document.getElementById('resultXP').textContent='+'+d.xp_earned+' XP ✨';
        if(d.level.includes('متقدم')){document.getElementById('resultIcon').textContent='🏆';document.getElementById('resultLevel').textContent='مستوى متقدم Advanced'}
        else if(d.level.includes('متوسط')){document.getElementById('resultIcon').textContent='🥈';document.getElementById('resultLevel').textContent='مستوى متوسط Intermediate'}
        else{document.getElementById('resultIcon').textContent='🌱';document.getElementById('resultLevel').textContent='مستوى مبتدئ Beginner'}
        let bd='';for(let[k,v]of Object.entries(d.skill_breakdown))bd+=k+': '+v.correct+'/'+v.total+' | ';
        document.getElementById('skillBreakdown').textContent=bd||''
    }catch(e){alert('فشل إرسال النتيجة')}
}

function finishEarly(){if(confirm('هل أنت متأكد من إنهاء الامتحان؟'))submitExam()}
function goToDashboard(){
    const uid=STUDENT_ID||new URLSearchParams(window.location.search).get('user_id')||5602495831;
    window.location.href='/dashboard/'+uid
}
</script>
</body>
</html>
