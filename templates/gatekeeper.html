<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار {{ stage.code }} — أكاديمية يامن</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: 'Segoe UI', 'Tajawal', 'Tahoma', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh; padding: 16px; color: #2d3748;
  }
  .container { max-width: 760px; margin: 0 auto; }

  /* Header */
  .header {
    background: rgba(255,255,255,0.98);
    border-radius: 20px; padding: 22px 26px;
    margin-bottom: 18px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.18);
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .header h1 { font-size: 19px; color: #2d3748; font-weight: 700; }
  .badge {
    background: linear-gradient(135deg, #f6ad55, #ed8936); color: #fff;
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 700;
    box-shadow: 0 4px 12px rgba(237,137,54,0.4);
  }
  .info-row { color: #718096; font-size: 13px; margin-bottom: 12px; line-height: 1.6; }
  .info-row b { color: #ed8936; }
  .progress-wrap { background: #edf2f7; height: 10px; border-radius: 999px; overflow: hidden; }
  .progress-fill {
    background: linear-gradient(90deg, #f6ad55, #ed8936);
    height: 100%; border-radius: 999px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 2px 8px rgba(237,137,54,0.5);
  }
  .progress-meta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 13px; color: #718096; }
  .progress-meta strong { color: #2d3748; }

  /* Question card */
  .card {
    background: #fff; border-radius: 20px;
    padding: 28px 26px; margin-bottom: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    animation: slideIn 0.4s ease-out;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; transform: none; } }
  .q-label {
    display: inline-block;
    background: #fff5eb; color: #c05621;
    padding: 4px 12px; border-radius: 8px;
    font-size: 13px; font-weight: 700; margin-bottom: 14px;
  }
  .q-text {
    font-size: 18px; color: #1a202c;
    line-height: 1.75; margin-bottom: 22px; font-weight: 500;
  }
  .options { display: flex; flex-direction: column; gap: 12px; }
  .opt {
    background: #f7fafc; border: 2px solid #e2e8f0;
    border-radius: 14px; padding: 16px 18px;
    cursor: pointer; transition: all 0.2s;
    font-size: 15px; display: flex; align-items: center; gap: 12px;
    line-height: 1.6;
  }
  .opt:hover { background: #edf2f7; border-color: #cbd5e0; transform: translateX(-4px); }
  .opt-letter {
    background: #e2e8f0; color: #4a5568;
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px; font-weight: 700; flex-shrink: 0; font-size: 14px;
    transition: all 0.2s;
  }
  .opt.selected { background: #fff5eb; border-color: #ed8936; }
  .opt.selected .opt-letter { background: #ed8936; color: #fff; }
  .opt-text { flex: 1; }

  /* Button */
  .btn {
    background: linear-gradient(135deg, #ed8936, #dd6b20);
    color: #fff; border: none;
    padding: 16px 28px; border-radius: 14px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    width: 100%; margin-top: 18px;
    box-shadow: 0 6px 20px rgba(237,137,54,0.4);
    transition: all 0.2s; font-family: inherit;
  }
  .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(237,137,54,0.5); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

  /* Result */
  .result-card { text-align: center; padding: 40px 28px; }
  .result-icon { font-size: 80px; margin-bottom: 16px; line-height: 1; }
  .result-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .result-card.pass .result-title { color: #2f855a; }
  .result-card.fail .result-title { color: #c53030; }
  .score-circle {
    width: 160px; height: 160px; border-radius: 50%;
    margin: 20px auto; display: flex; align-items: center; justify-content: center;
    background: conic-gradient(#ed8936 var(--p), #edf2f7 0);
    position: relative;
  }
  .score-inner {
    width: 130px; height: 130px; border-radius: 50%;
    background: #fff; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-num { font-size: 38px; font-weight: 800; color: #2d3748; }
  .score-label { font-size: 12px; color: #718096; margin-top: 4px; }
  .stats { display: flex; justify-content: center; gap: 16px; margin: 20px 0; flex-wrap: wrap; }
  .stat-box { background: #f7fafc; padding: 14px 20px; border-radius: 12px; min-width: 110px; }
  .stat-num { font-size: 24px; font-weight: 700; color: #2d3748; }
  .stat-label { font-size: 12px; color: #718096; margin-top: 4px; }
  .stat-box.green .stat-num { color: #38a169; }
  .stat-box.red .stat-num { color: #e53e3e; }
  .result-msg { color: #4a5568; font-size: 15px; line-height: 1.7; margin: 16px 0 24px; }
  .back-btn {
    display: inline-block; padding: 14px 32px;
    background: linear-gradient(135deg, #4a5568, #2d3748); color: #fff;
    border-radius: 12px; text-decoration: none; font-weight: 600;
    transition: all 0.2s; margin: 6px;
  }
  .back-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
  .back-btn.primary { background: linear-gradient(135deg, #38a169, #2f855a); }
  .back-btn.retry { background: linear-gradient(135deg, #ed8936, #dd6b20); }
  .loading { text-align: center; padding: 40px; }
  .spinner {
    width: 50px; height: 50px;
    border: 4px solid #edf2f7; border-top-color: #ed8936;
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-top">
      <h1>📝 اختبار نهاية المرحلة</h1>
      <span class="badge">{{ stage.code }}</span>
    </div>
    <div class="info-row">
      المرحلة: <b>{{ stage.name_ar }}</b><br>
      يجب الحصول على <b>{{ pass_threshold }}%</b> أو أكثر لاجتياز الاختبار وفتح المرحلة التالية.
    </div>
    <div class="progress-wrap"><div class="progress-fill" id="pbar" style="width: 0%"></div></div>
    <div class="progress-meta">
      <span>السؤال <strong id="qcur">1</strong> من <strong>{{ questions|length }}</strong></span>
      <span id="answered">تم الإجابة: 0</span>
    </div>
  </div>

  <div id="quizArea"></div>
  <div id="resultArea" style="display:none;"></div>
</div>

<script>
const QUESTIONS = {{ questions|tojson }};
const STAGE_ID = {{ stage.id }};
const USER_ID = "{{ user_id }}";
const PASS = {{ pass_threshold }};
let idx = 0;
let answers = {};

function letterFromIdx(i) { return ["A","B","C","D","E","F"][i] || String.fromCharCode(65+i); }
function escapeHtml(s) {
  return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function render() {
  if (idx >= QUESTIONS.length) return showFinal();
  const q = QUESTIONS[idx];
  document.getElementById("qcur").textContent = idx + 1;
  document.getElementById("pbar").style.width = ((idx)/QUESTIONS.length*100) + "%";
  document.getElementById("answered").textContent = "تم الإجابة: " + Object.keys(answers).length;

  let html = '<div class="card">';
  html += '<span class="q-label">السؤال ' + (idx+1) + ' من ' + QUESTIONS.length + '</span>';
  html += '<div class="q-text">' + escapeHtml(q.question || "—") + '</div>';
  html += '<div class="options">';
  const userPick = answers[q.id];
  (q.options || []).forEach((opt, i) => {
    const letter = letterFromIdx(i);
    const text = (typeof opt === "string") ? opt : (opt.text || opt.label || JSON.stringify(opt));
    const sel = (userPick === letter) ? " selected" : "";
    html += '<div class="opt' + sel + '" onclick="pick(this,\'' + letter + '\')">' +
            '<div class="opt-letter">' + letter + '</div>' +
            '<div class="opt-text">' + escapeHtml(text) + '</div></div>';
  });
  html += '</div>';
  const lastQ = idx === QUESTIONS.length - 1;
  html += '<button class="btn" id="nextBtn" ' + (userPick ? "" : "disabled") + ' onclick="next()">' +
          (lastQ ? '✅ إنهاء وعرض النتيجة' : 'السؤال التالي ←') + '</button>';
  html += '</div>';
  document.getElementById("quizArea").innerHTML = html;
}

function pick(el, letter) {
  document.querySelectorAll(".opt").forEach(o => o.classList.remove("selected"));
  el.classList.add("selected");
  answers[QUESTIONS[idx].id] = letter;
  document.getElementById("nextBtn").disabled = false;
  document.getElementById("answered").textContent = "تم الإجابة: " + Object.keys(answers).length;
}

function next() { idx++; render(); }

async function showFinal() {
  document.getElementById("pbar").style.width = "100%";
  document.getElementById("qcur").textContent = QUESTIONS.length;
  document.getElementById("quizArea").style.display = "none";
  const res = document.getElementById("resultArea");
  res.style.display = "block";
  res.innerHTML = '<div class="card loading"><div class="spinner"></div><div style="color:#718096">جاري تصحيح الإجابات...</div></div>';

  try {
    const r = await fetch("/foundation/gatekeeper/" + STAGE_ID + "/submit?user_id=" + USER_ID, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({answers: answers})
    });
    const data = await r.json();
    if (!data.ok) throw new Error(data.error || "submit failed");
    const passed = data.passed;
    const cls = passed ? "pass" : "fail";
    const icon = passed ? "🎉" : "📚";
    const title = passed ? "تهانينا! نجحت في الاختبار" : "لم تصل للحد المطلوب";
    const msg = passed
      ? "أحسنت! اجتزت اختبار هذه المرحلة بنجاح. تم فتح المرحلة التالية لك."
      : "تحتاج إلى " + PASS + "% على الأقل. راجع الدروس وأعد المحاولة، أنت قريب!";
    const wrong = data.total - data.correct;

    let html = '<div class="card result-card ' + cls + '">';
    html += '<div class="result-icon">' + icon + '</div>';
    html += '<div class="result-title">' + title + '</div>';
    html += '<div class="score-circle" style="--p:' + (data.score_pct * 3.6) + 'deg">';
    html += '<div class="score-inner"><div class="score-num">' + data.score_pct + '%</div><div class="score-label">النتيجة</div></div>';
    html += '</div>';
    html += '<div class="stats">';
    html += '<div class="stat-box green"><div class="stat-num">' + data.correct + '</div><div class="stat-label">إجابة صحيحة</div></div>';
    html += '<div class="stat-box red"><div class="stat-num">' + wrong + '</div><div class="stat-label">إجابة خاطئة</div></div>';
    html += '<div class="stat-box"><div class="stat-num">' + data.total + '</div><div class="stat-label">إجمالي الأسئلة</div></div>';
    html += '</div>';
    html += '<div class="result-msg">' + msg + '</div>';
    if (passed) {
      html += '<a class="back-btn primary" href="/foundation?user_id=' + USER_ID + '">→ المتابعة للمرحلة التالية</a>';
    } else {
      html += '<a class="back-btn retry" href="/foundation/gatekeeper/' + STAGE_ID + '?user_id=' + USER_ID + '">🔄 إعادة المحاولة</a>';
      html += '<a class="back-btn" href="/foundation/stage/' + STAGE_ID + '?user_id=' + USER_ID + '">📖 مراجعة الدروس</a>';
    }
    html += '</div>';
    res.innerHTML = html;
  } catch (e) {
    res.innerHTML = '<div class="card result-card fail"><div class="result-icon">❌</div>' +
      '<div class="result-title">حدث خطأ</div>' +
      '<div class="result-msg">' + escapeHtml(e.message) + '</div>' +
      '<a class="back-btn" href="/foundation?user_id=' + USER_ID + '">العودة</a></div>';
  }
}

render();
</script>
</body>
</html>
