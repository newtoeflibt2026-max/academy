<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>{{ lesson.title_ar }}</title>
<style>body{font-family:'Cairo',sans-serif;background:#f7fafc;padding:30px;direction:rtl}
.c{max-width:800px;margin:0 auto;background:white;padding:30px;border-radius:16px}
h1{color:#2d3748}a{color:#667eea}.back{display:inline-block;margin-bottom:20px}</style></head>
<body><div class="c">
<a class="back" href="/writing/stage/{{ lesson.stage_id }}?user_id={{ user_id }}">← العودة للمرحلة</a>
<h1>{{ lesson.title_ar }}</h1>
<div style="margin:20px 0;line-height:1.8">{{ lesson.content_html|safe }}</div>
{% if questions %}<hr/><h3>اختبر فهمك ({{ questions|length }} أسئلة)</h3>
<p style="color:#a0aec0">🚧 الواجهة التفاعلية ستُضاف في Phase 2B</p>{% endif %}
</div></body></html>
