<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Build a Sentence - TOEFL Writing</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f5f7fa;padding:16px;min-height:100vh}
.container{max-width:760px;margin:0 auto;background:#fff;border-radius:16px;box-shadow:0 4px 20px rgba(0,0,0,.08);overflow:hidden}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:19px}
.timer{background:rgba(0,0,0,.25);padding:8px 16px;border-radius:10px;font-weight:bold;font-size:16px}
.timer.low{background:#dc2626}
.progress{font-size:13px;opacity:.9;margin-top:4px}
.content{padding:26px 24px}
.context{background:#eef2ff;border-left:4px solid #667eea;padding:12px 16px;border-radius:8px;margin-bottom:6px;font-size:15px;color:#3730a3}
.context .who{font-size:12px;color:#6366f1;font-weight:bold;margin-bottom:2px}
.instruction{font-size:13px;color:#64748b;margin:14px 0 8px}
.answer-zone{min-height:54px;border:2px dashed #c7d2fe;border-radius:10px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:#fafbff;margin-bottom:14px}
.answer-zone:empty::before{content:"Click words in the correct order \2192";color:#9fa8da;font-size:14px}
.scrambled-zone{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px}
.chip{background:#fff;border:2px solid #c7d2fe;border-radius:8px;padding:9px 16px;font-size:15px;cursor:pointer;user-select:none;transition:.15s}
.chip:hover{background:#eef2ff;transform:translateY(-2px)}
.answer-zone .chip{background:#667eea;color:#fff;border-color:#667eea}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 22px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-clear{background:#e2e8f0;color:#334155}
.btn-next{background:#10b981;color:#fff;flex:1}
.btn-next:disabled{background:#94a3b8;cursor:not-allowed}
.done{text-align:center;padding:40px 24px}
.done .ico{font-size:52px;margin-bottom:10px}
.done h2{margin-bottom:8px}
.done p{color:#64748b;margin-bottom:22px}
.done a{display:inline-block;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-decoration:none;padding:15px 38px;font-size:17px;font-weight:bold;border-radius:12px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>Section 1: Build a Sentence</h1><div class="progress" id="prog">Item 1 of 10</div></div>
    <div class="timer" id="timer">--:--</div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const ITEMS = {{ items_json|safe }};
const USER_ID = "{{ user_id }}";
let TIME = {{ timer_seconds }};
let idx = 0, correct = 0;
let selected = [], pool = [];

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function render(){
  if(idx>=ITEMS.length){return finish();}
  const it = ITEMS[idx];
  document.getElementById('prog').textContent = 'Item '+(idx+1)+' of '+ITEMS.length;
  selected = []; pool = shuffle(it.words);
  const c = document.getElementById('content');
  c.innerHTML =
    '<div class="context"><div class="who">A:</div>'+it.context+'</div>'
    +'<div class="instruction">Arrange the words to form a correct '+(it.is_question?'question':'sentence')+':</div>'
    +'<div class="answer-zone" id="ans"></div>'
    +'<div class="scrambled-zone" id="pool"></div>'
    +'<div class="btns"><button class="btn btn-clear" onclick="clearAns()">Clear</button>'
    +'<button class="btn btn-next" id="nextBtn" onclick="submitItem()">'+(idx===ITEMS.length-1?'Finish Section':'Next')+'</button></div>';
  drawPool(); drawAns();
}
function drawPool(){
  const p = document.getElementById('pool'); p.innerHTML='';
  pool.forEach((w,i)=>{const b=document.createElement('div');b.className='chip';b.textContent=w;b.onclick=()=>{selected.push(w);pool.splice(i,1);drawPool();drawAns();};p.appendChild(b);});
}
function drawAns(){
  const a = document.getElementById('ans'); a.innerHTML='';
  selected.forEach((w,i)=>{const b=document.createElement('div');b.className='chip';b.textContent=w;b.onclick=()=>{pool.push(w);selected.splice(i,1);drawPool();drawAns();};a.appendChild(b);});
}
function clearAns(){pool=pool.concat(selected);selected=[];drawPool();drawAns();}
function norm(s){return s.replace(/[?.,]/g,'').trim().toLowerCase().replace(/\s+/g,' ');}
function submitItem(){
  const built = selected.join(' ');
  if(norm(built)===norm(ITEMS[idx].answer)) correct++;
  idx++; render();
}
function finish(){
  document.getElementById('timer').style.display='none';
  document.getElementById('prog').textContent='Completed';
  document.getElementById('content').innerHTML =
    '<div class="done"><div class="ico">\u2705</div><h2>Section 1 completed</h2>'
    +'<p>Score: '+correct+' / '+ITEMS.length+'. Continue to the next task.</p>'
    +'<a href="/writing/mock-exam/email?user_id='+USER_ID+'">\u27a1\ufe0f Next: Write an Email</a></div>';
}
function tick(){
  let m=Math.floor(TIME/60), s=TIME%60;
  const t=document.getElementById('timer');
  t.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  if(TIME<=60) t.classList.add('low');
  if(TIME<=0){clearInterval(iv); finish(); return;}
  TIME--;
}
let iv=setInterval(tick,1000); tick();
render();
</script>
</body>
</html>
