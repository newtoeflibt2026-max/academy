<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة الطالب | Yamen Academy TOEFL 2026</title>
    <meta name="description" content="لوحة تحكم تنفيذية احترافية لربط بيانات الطالب الفعلية بالخطة الشخصية، التقدم اليومي، ومحطات الإنجاز." />
    <style>
        :root {
            --bg: #0a0f1d;
            --bg-soft: #11182b;
            --bg-deep: #070b15;
            --panel: rgba(255, 255, 255, 0.08);
            --panel-strong: rgba(255, 255, 255, 0.12);
            --line: rgba(255, 255, 255, 0.12);
            --line-strong: rgba(212, 175, 55, 0.28);
            --text: #f8fafc;
            --muted: #b5bfd6;
            --gold: #d4af37;
            --gold-soft: rgba(212, 175, 55, 0.12);
            --blue: #2563eb;
            --green: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
            --radius-xl: 28px;
            --radius-lg: 22px;
            --radius-md: 18px;
            --radius-sm: 14px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top right, rgba(37, 99, 235, 0.20), transparent 24%),
                radial-gradient(circle at bottom left, rgba(16, 185, 129, 0.16), transparent 20%),
                radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.12), transparent 18%),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            width: 340px;
            height: 340px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            top: -80px;
            right: -90px;
            background: var(--gold);
        }

        body::after {
            left: -90px;
            bottom: -90px;
            background: var(--blue);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        .shell {
            width: min(1240px, calc(100% - 28px));
            margin: 0 auto;
            padding: 28px 0 50
