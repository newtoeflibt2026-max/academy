<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yamen Academy</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3B82F6">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div id="loading">
        <div style="text-align:center;width:100%">
            <div style="width:50px;height:50px;border:4px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 15px"></div>
            <div style="font-size:28px;font-weight:700;color:#fff">🕌 Yamen Academy</div>
        </div>
    </div>

    <div id="app">
        <div style="background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;padding:30px 20px;text-align:center;border-radius:0 0 25px 25px">
            <h1 style="margin:0">🕌 Yamen Academy</h1>
            <p style="margin:5px 0 0;opacity:0.9">مرحباً بك في أكاديمية يامن للغات</p>
        </div>
        <div style="max-width:1000px;margin:20px auto;padding:0 15px">
            <!-- هذه البطاقة تظهر فوراً بدون انتظار JavaScript -->
            <div style="background:#fff;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,0.08);text-align:center">
                <h2 style="color:#10B981;margin-top:0">✅ الأكاديمية تعمل!</h2>
                <p style="color:#666">الواجهة جاهزة. أضف دورات من لوحة التحكم لبدء التعليم.</p>
                <a href="/admin" style="display:inline-block;margin-top:10px;padding:12px 24px;background:#3B82F6;color:#fff;border-radius:10px;text-decoration:none">🔧 لوحة التحكم</a>
            </div>
            <div style="background:#fff;border-radius:15px;padding:20px;margin:15px 0;box-shadow:0 2px 8px rgba(0,0,0,0.08)">
                <h2>📚 الدورات</h2>
                <div id="coursesList">
                    <p style="color:#3B82F6">جاري تحميل الدورات...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="adminApp" style="display:none">
        <div style="background:linear-gradient(135deg,#10B981,#059669);color:#fff;padding:30px 20px;text-align:center;border-radius:0 0 25px 25px">
            <h1 style="margin:0">🔧 لوحة التحكم</h1>
        </div>
    </div>

    <style>
        body {
            background: #f0f2f5 !important;
            min-height: 100vh;
            margin: 0;
            font-family: 'Cairo', sans-serif;
            direction: rtl;
        }
        #app { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="/config.js"></script>
    <script src="/app.js"></script>
</body>
</html>
