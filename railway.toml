[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "gunicorn -w 2 -k gthread --threads 4 --timeout 120 -b 0.0.0.0:$PORT wsgi:app"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.envs]
PYTHONUNBUFFERED = "1"
DB_PATH = "/app/data/academy.db"
